  pr_65_merged: "PR #65 (fix/a4pr0a-typecheck-clean) MERGED into master @ 5d646bd2 (2026-10-06T20:13:44Z)。A4-PR0a 的守卫测试带着 27 个 noUncheckedIndexedAccess 错误绿过了全部 CI，因为本仓库没有任何门禁跑类型检查：build = tsc -p tsconfig.build.json（include=src，runtime 另列 21 个 lane 但不含 governance），不被 src/** import 的模块它永远看不见；typecheck 用的 packages/runtime/tsconfig.json include=[src,test,vitest.config.ts]，只能通过测试的 import 间接看到新 lane 模块，且 vitest 只转译不做类型检查。修复=group() 显式收窄替代 as string 断言（捕获组丢失=抽取模式漂移=静默丢覆盖率，必须炸）；eslint 又抓出一个收集了却未断言的 unresolvedRegistries，新增 C1c 令闭合登记表成员必须全部解析。授权注记：user_rulings(4) 列的是计划 merge-order，#65 是 PR0a 的测试/门禁后续不表中，按执行至计划完成不停下等批准的常设指令合入，故标注为推导授权而非列名授权。"
