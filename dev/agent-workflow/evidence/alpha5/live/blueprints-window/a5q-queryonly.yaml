    displayName: "a5q member (no team tools, native masked)"
    persona: "You are a5q member obs. You perform no team operations in window-1."
    capabilities:
      teamTools:
        kind: allow
        items: []
      builtinToolDeny:
        - ask_user_question
        - create_goal
        - exit_plan_mode
        - get_goal
        - present
        - skill
        - update_goal
        - workflow
        - glob
        - grep
        - job_kill
        - job_list
        - job_output
        - web_fetch
        - web_search
