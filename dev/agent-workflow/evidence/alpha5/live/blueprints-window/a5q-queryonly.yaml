      - create_goal
      - exit_plan_mode
      - get_goal
      - present
      - skill
      - update_goal
      - workflow
      - glob
      - grep
      - job_kill
      - job_list
      - job_output
      - web_fetch
      - web_search
    skills:
      kind: allow
      items: []
    mcp:
      kind: allow
      items: []
    permissions:
      default: ask
      allow: []
      ask: []
      deny: []
members:
