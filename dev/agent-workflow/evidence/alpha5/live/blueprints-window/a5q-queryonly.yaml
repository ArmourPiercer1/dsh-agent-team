# A5M2 B-TEAM window query-only blueprint (root's limited config-fix ruling).
# Leader capabilities: teamTools narrowed to the ONE target query; the 15 native
# tools named by THIS run's raw line 6 are masked through the real
# applyBuiltInToolDeny scope (packed agent-bindings.mjs:2785, selective-mode
# maskedNames :2738/:4295; closed shape static-capability-source.d.ts:28-32).
# Coverage/Guard/default-ask stay exactly as the host resolves them; NO allow-all,
# no fake managed, no enum/safelist change. a5nx-main.yaml is untouched history.
schemaVersion: 3
blueprintId: team.a5q-queryonly
revision: "1"
leader:
  templateId: leader
  persona: "You are the leader of the a5q query-only team. Follow the directive marker exactly and call the named team tool exactly once."
