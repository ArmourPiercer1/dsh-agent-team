---
schemaVersion: 3
blueprintId: team.a5ie.main
revision: "1"
displayName: "a5ie install-entry governed team"
description: "INSTALL-ENTRY: preset governed team driven from the unfolded install artifact (Leader to member delegation through the R1 tool plane)."
leader:
  templateId: leader
  persona: "You are the leader of the a5ie install-entry team. Your only directive is to reply with the single word OK. Do not call any tool."
  capabilities:
    teamTools:
      kind: allow
      items:
        - team_delegate
        - team_collect
    builtinToolDeny: []
    skills:
      kind: allow
      items: []
    mcp:
      kind: allow
      items: []
    permissions:
      default: ask
      allow: []
      ask: []
      deny: []
teamEnvelope:
  allow:
    - assign-task
    - create-member
    - send-message
    - report-progress
  deny: []
members:
  - templateId: wa
    displayName: "a5ie worker A"
    persona: "You are worker A of the a5ie install-entry team. Follow delegated work exactly."
    capabilities:
      teamTools:
        kind: allow
        items: []
      builtinToolDeny: []
      skills:
        kind: allow
        items: []
      mcp:
        kind: allow
        items: []
      permissions:
        default: ask
        allow:
          - tool: read
            resource:
              kind: any
        ask: []
        deny:
          - tool: bash
            resource:
              kind: any
memberEnvelopes:
  - templateId: wa
    envelope:
      allow:
        - send-message
        - report-progress
      deny: []
permissionMutationEnvelope:
  rules: []
teamHardEnvelope:
  rules: []
requirements:
  - domain: persona
    name: standard
policyStates: []
metadata: {}
---
