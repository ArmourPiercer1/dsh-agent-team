# dsh-agent-team — the shipped bundle layer (manifest `dsh.bundle.patch`).
#
# Machine-agnostic by contract: every row references THIS PACKAGE by name —
# the host row via the `./host` subpath export (the built dist host entry),
# the client row via the bare package name (the client module system reads
# the root `dsh.client` manifest and serves the `./client` export). No file
# URLs, no machine paths, no repo-relative locations: the same layer doc
# installs on any machine.
#
# The row config intentionally carries NO glueUrl/seamUrl/defaultWorkspace:
# the host entry derives the glue and seam module URLs from its own module
# location (see packages/runtime/src/plugin/host.ts — defaultGlueUrl /
# defaultSeamUrlCandidates, fail-closed when unresolvable) and, when the
# row carries no defaultWorkspace, defaults the team workspace to the
# directory the operator launched the host from (withDefaultWorkspace —
# the projection fold requires a resolvable effective workspace on every
# team row; the glue's agent-cwd fallback reads the same config value).
#
# Override semantics (last-write-wins, WHOLE config replaced): the profile's
# own `cordis.patch.yml` is applied AFTER this bundle layer; a row with the
# same `id` and a `config` replaces this layer's config entirely — use that
# to point `staticModel` at your provider/model, to customize the
# `blueprintSource` team design, or to set `defaultWorkspace`. Omitting a
# field in the override row drops it (no field-level merge).
#
# Boot phase (remote-mount-race fix, root cause B): the shipped row boots
# with `bootPhase: "create-or-open"` — ADOPT an already-stamped `team_domain`,
# or initialize a fresh medium on the first-ever boot (a restart can never
# break a production host). This is a DISTINCT phase, deliberately not
# `resume`: plan §7-B2 makes `resume` strict load-only (a resume never
# creates — T12-B2 W4), and `create` stays the strict fresh-world entry the
# harness/boot worlds use. The pre-fix default `"create"` threw
# TEAM_DOMAIN_EXISTS on every returning home and the row bootstrap
# SWALLOWED that rejection (zero terminal signal: the /team-remote routes
# never registered and the team UI failed with the frontend static
# handler's HTTP 405).
#
# Strict-read + core-spill (Phase C): the base `spill-local` row is
# DISABLED and replaced by this package's Team-aware provider
# (`dsh-agent-team/spill-local` → packages/runtime/dist/.../
# team-spill-local.js, the `./spill-local` subpath export). The provider
# is a strict superset of the base row — same `spillStore` service name,
# same config surface (no config here = the base row's defaults: private
# temp root, 30-day cleanup sweep) — plus the durable artifact-read
# grant record for managed Team sessions (the producer side of the
# content-read vertical; the host row fills the `teamArtifactAuthority`
# bridge the provider reads lazily per save). An unmanaged session
# (no team binding) stays byte-for-byte upstream-equivalent.
- id: spill-local
  disabled: true

- insert:
    # ── THE COMPOSITION-OWNED WEB TRANSPORT (PD-30, 2026-11-15) ──────────────
    # The transport a governed Member's confined `web` face calls AFTER the
    # compiled network lane admits a request. PD-27 restored the model-visible
    # `web_fetch`/`web_search` names and the confined face; the FACE had no
    # transport, so only a test driver row could make the pair real. This row is
    # that missing half, SHIPPED: it loads the pinned host's own providers by
    # their public package names (`dsh-web-fetch-http` for fetch,
    # `dsh-web-search-exa` for search) and provides the optional
    # `teamA5sfWebTransport` service the product row (`dsh-agent-team/host`)
    # reads lazily when it builds a governed realm.
    #
    # WHY IT IS A SEPARATE ROW RATHER THAN PART OF THE TEAM ROW: the transport is
    # a COMPOSITION decision (which provider, which endpoint, which declared test
    # fixtures) and the row config is the composition's only place to state it.
    # A deployment that does not mount this row gets the pre-PD-30 behaviour
    # exactly: a governed realm with `subprocess` + `terminal` and NO web face.
    #
    # CONFIG, AND WHY THESE `!!js` READS EXIST:
    #   - `search.baseURL` / `search.apiKey` are the real Exa endpoint/credential.
    #     Defaults are the public API and `$EXA_API_KEY`; an operator may point
    #     `baseURL` at an internal gateway. The EVIDENCE suite points it at a
    #     local endpoint so "a real request was issued and the answer parsed" is
    #     measured without an external account — a fixture choice on the same
    #     code path, not a second implementation.
    #   - `testEndpoints` is the SSRF exemption, and it is DELIBERATELY EMPTY by
    #     default. The face refuses loopback/private/link-local/metadata
    #     destinations; a local fixture is loopback, so a test deployment
    #     declares the exact origins it stood up, and every other destination is
    #     classified as usual. A shipped deployment leaves this unset.
    # Nothing here selects a policy: the network decision stays in the ONE guard
    # (`team-services/src/web.ts`) and this row only transports an admitted call.
    - id: "a5sf-web-transport"
      name: "dsh-agent-team/web-transport"
      config:
        testEndpoints: !!js (process.env.A5SF_WEB_TEST_ENDPOINTS ?? '').split(',').map((entry) => entry.trim()).filter((entry) => entry !== '')
        search:
          baseURL: !!js process.env.A5SF_WEB_SEARCH_BASE_URL ?? 'https://api.exa.ai'
          apiKey: !!js process.env.A5SF_WEB_SEARCH_API_KEY ?? process.env.EXA_API_KEY ?? ''
    - id: "dsh-agent-team"
      name: "dsh-agent-team/host"
      config:
        bootPhase: "create-or-open"
        rootSessionId: "team-root"
        # The embedded Team design is a schema version 3 document: it carries
        # the two authority documents that this version makes REQUIRED
        # (`permissionMutationEnvelope` — optional at every earlier version and
        # a hard requirement here, ADR A1-19; `teamHardEnvelope` — introduced
        # by this version and never optional, spec §3.2 "no implicit default is
        # permitted"). §7.4 promotion, landed BEFORE the §7.3 version flip:
        # v3 parses today and is the only form the flip keeps, so this row is
        # unchanged in acceptance by the cutover it precedes.
        blueprintSource: |
          ---
          schemaVersion: 3
          blueprintId: my-team-bp-1
          revision: "1"
          leader:
            templateId: leader
            persona: "You lead this team."
          members:
            - templateId: worker
              displayName: "Worker A"
              persona: "You are a worker on this team."
          requirements:
            - domain: persona
              name: standard
          teamEnvelope:
            allow: [assign-task, create-member, send-message, report-progress, archive-member, restore-member]
            deny: [delete-team]
          memberEnvelopes:
            - templateId: worker
              envelope:
                allow: [send-message, report-progress]
                deny: []
          policyStates:
            - id: default
              description: "Default state."
          quotas:
            team:
              maxInstances: 12
              maxConcurrent: 12
            members:
              maxInstances: 4
              maxConcurrent: 4
          metadata: {}
          # The two authority documents this version requires, at the HONEST
          # ZERO position `rules: []` — never a permissive filler rule. The two
          # planes read this same absence differently, and both readings are
          # pinned in production code, so the claim is stated per plane:
          #   - EXPANSION plane (domain/authority-envelope effectiveAuthority-
          #     Ceiling): an unmatched scope is no-authority — with an empty
          #     rule list the Leader of this Team may expand NOTHING.
          #   - APPROVAL plane (domain/permission-plane bindingDocs): an absent
          #     rule imposes NO narrowing — a Human User approving a concrete
          #     operation is impeded only by the host-side law, never by a
          #     narrowing from this document.
          # This zero is inert in exactly one world, and this shipped design
          # lives in it: a Team that never asks to expand anything — member
          # permissions come solely from the static lanes declared above, no
          # permission mutation ever runs, and no rising-authority proposal is
          # made. It is NOT inert in general: an operator whose profile-layer
          # override of this row designs for expansion must declare real rules
          # in these documents, not inherit this pair.
          permissionMutationEnvelope:
            rules: []
          teamHardEnvelope:
            rules: []
          ---
        seedMembers: []
        generation: 1
        deniedSelection: null
        # Canonical 0..N MCP configuration (empty array = no MCP). The legacy
        # single `mcpServer` field is still accepted during this alpha; when
        # both are present, `mcpServer` must be null (ambiguous otherwise).
        # See docs/INSTALL.md §3.3 for the full semantics.
        mcpServers: []
        staticModel:
          provider: deepseek-official
          model: deepseek-v4-flash
        environmentFacts:
          - { domain: "tool", subject: "web", available: true, generation: 1 }
          - { domain: "skill", subject: "base", available: true, generation: 1 }
          - { domain: "persona", subject: "standard", available: true, generation: 1 }
        externalPolicyFacts:
          hard: {}
          capabilityExists: {}
    # ── GOVERNED MEMBER PRESET (opt-in, 2026-11-11 owner ruling) ─────────────
    # A Member preset whose model-visible `bash` is the CONFINED terminal face
    # (PD-13): each command is a fresh confined child and each lexically named
    # read is admitted against the ceiling compiled from the Team's BOUND
    # blueprint. This row is SHIPPED but NEVER SELECTED here: the deployment
    # default stays `standard`, `rootPresetId`/`memberPresetId` stay absent from
    # this layer, and the LEADER is not a Member so it never enters a realm. A
    # Team opts in ONLY by explicitly setting BOTH
    #   memberPresetId: a5sf-governed-member        (this preset id)
    #   a5sfGovernedRealm: true                     (the neutral enablement key)
    # on its OWN profile-level override of the `dsh-agent-team` row, whose
    # `blueprintSource` must then be a schemaVersion 4 design carrying a
    # `memberIoCeilings` family. A v3 blueprint refuses (typed), it is never
    # granted a default ceiling.
    #
    # SURFACE (measured, see dev/agent-workflow/evidence/a5sf-governed-preset/
    # tool-surface.json): this list is the pinned `standard` preset VERBATIM
    # minus the rows enumerated below, plus nothing else. Each removal is a FAIL-CLOSED
    # capability regression, not a fix that keeps the capability:
    #   - `tool-pwsh` — a second, UNINSTRUMENTED shell; leaving it in place
    #     would keep an un-attributed read path beside the governed `bash`.
    #   - `workflow-ptc`/`tool-workflow` (PD-18, 2026-11-13) — on the SHIPPED
    #     governed preset these resolved to the host's base services: `workflow`
    #     executed model-written JavaScript in a real PTC child under the HOST
    #     sandbox policy (ZERO a5sf-guard-consult facts; `confinedTurnLaunchers`
    #     unchanged), and the confined subprocess face refuses `node`/interpreter
    #     argv at admission by design, so it cannot be routed onto this realm. A
    #     Member that cannot name it gets the host router's typed `UNKNOWN_TOOL`
    #     and runs nothing; the capability is GONE from the governed preset until
    #     a governed face exists for it. `run_code` was never on this surface, and
    #     ROUND 92 (owner ruling `docs/reviews/20261124-0151.txt` §PTC, 2026-11-24)
    #     closes it for the whole generation: PTC is NOT SUPPORTED BY PRODUCT RULING,
    #     never offered to a governed Member, and a call through the host-retained
    #     entry is a TYPED refusal with the `unsupported-by-product-ruling` status and
    #     zero worker start (`ADR-ptc-unsupported.md`). This is a RULED scope
    #     reduction, not a temporary removal waiting for a fix.
    #     PD-27 note: PD-18 removed `tool-web` in the SAME change for the same
    #     reason (base `ctx.web`, zero facts); PD-27 below restores that half
    #     only, served by the Member's confined `web` face.
    #   - `bash` KEEPS its name. Round 76 mounts the HOST's own PERSISTENT
    #     definition (`@deepseek-ai/dsh-tool-bash-persistent`) beside the
    #     one-shot row: the persistent row is the module the governed realm
    #     lane mounts into the Member's isolated scope, where its
    #     `backendType: a5sf-governed-shell` names the Member-bound PTY face
    #     (the product's governed shell backend, registered by
    #     `team-services/src/terminal-pty.ts`). The one-shot row is retained as
    #     the SURFACE BASELINE that the realm lane replaces (its
    #     definition-identity check refuses a mount that does not take the name
    #     over), and it is dormant on the preset's own scope on this deployment
    #     (no base `terminals` service); a governed Member never executes it.
    #     DEPLOYMENT REQUIREMENT (measured, round 76): because the persistent
    #     row INJECTS `terminals`, the preset registry refuses to bind this
    #     preset unless the DEPLOYMENT provides a `terminals` service on an
    #     ancestor scope (`agent-preset/invalid` … 'waiting for terminals' — a
    #     pending row is NOT dormant). A deployment that mounts this preset must
    #     therefore compose the HOST's `@deepseek-ai/dsh-terminal` service; a
    #     deployment that composes it with NO PTY backend keeps the row
    #     fail-closed on the preset scope (`spawn` → `NO_BACKEND`, zero
    #     processes) while the Member's realm mount gets the governed face.
    #     The persistent definition's model-visible surface is `command` only,
    #     so `run_in_background`, per-call `timeoutMs`, `description`,
    #     `workdir`, `sandbox_permissions`/`justification` and the structured
    #     result object are GONE — cwd/env/background state now survives across
    #     calls.
    #   - the whole `delegation` GROUP (PD-21, 2026-11-14) — `subagent`,
    #     `subagent_fork`, `tool-subagent-control` (`send_message`/
    #     `interrupt_agent`) and `list_agents`. MEASURED on the real Host: a
    #     governed Member's `subagent` call spawned a live child session whose
    #     preset label was `a5sf-governed-member` but whose realm was NOT the
    #     Member's: the child's `read` returned the out-of-lane fixture bytes
    #     (native `tool-fs`, no guard fact) and its `bash` ran on the BASE
    #     subprocess (`cat` of the same file, two base-`bwrap` sightings, zero
    #     a5sf facts). The child also carried `subagent` itself, so depth was
    #     provider-managed recursion. The child ctx is a SIBLING of the realm's
    #     `fs`/`subprocess` isolate fork, so no preset-level row can inherit the
    #     realm; the disposition is therefore FAIL-CLOSED: the family is GONE
    #     from the governed preset (typed `UNKNOWN_TOOL`, zero children).
    #     The shipped-disabled `tool-ralph` row (subagentProvider: spawn) is
    #     removed with it: a disabled row is not a governance boundary, and a
    #     later enable would silently restore a spawn-capable face.
    #     `evidence/a5sf-pd21-subagent/`.
    #   - `present` is REMOVED by PD-24 (2026-11-14). MEASURED on the real Host
    #     in one delegated Member turn: `present` injects the BASE `fs` (its row
    #     mounts on the registry generation scope), so `ctx.fs.stat` resolved an
    #     OUT-OF-LANE path that the Member's compiled read lane does not cover.
    #     A real out-of-lane file was ACCEPTED (`Presented …/secret-out-of-lane.txt`)
    #     and a missing one was refused `file not found` — a cross-lane existence
    #     oracle — with ZERO `a5sf-guard-consult` facts, and two
    #     `deliverables/presented` events landed in the Member's own session.
    #     Re-parenting it onto the confined `fs` is the SAME seam PD-23 hit for
    #     `skill`: the confined provider is a fork in the Member isolate, and no
    #     preset-level row can be handed it. That is a `CORE_SEAM_BLOCKER`; the
    #     honest disposition inside this budget is FAIL-CLOSED REMOVAL, a
    #     CAPABILITY REGRESSION (a governed Member can no longer declare
    #     deliverables). `evidence/a5sf-pd24-surface-ledger/`.
    #     PD-26 (2026-11-14) RESTORES the NAME and routes the READ: the host
    #     `tool-present` row is back, and the realm's route-C attach re-mounts
    #     `confined-present-tool.mjs` inside the Member's isolated scope, where
    #     its `lstat`/`stat` run on the confined `fs` (`IO_READ_DENIED` + one
    #     deny fact for an out-of-lane path, zero bytes, no deliverables event)
    #     while an in-lane file is presented and recorded exactly as before.
    #     As with the PD-17 filesystem rows, the preset row is replaced by the
    #     shadow; the attach refuses the Member setup when it cannot shadow it.
    #   - `tool-jobs`, fs, search, goal/plan/todo and compaction are
    #     RETAINED. `tool-goal` is RETAINED AS OF PD-29 (2026-11-14, owner
    #     ruling): PD-25 had removed it fail-closed because the round budget is
    #     caller-chosen and no trustworthy TOTAL round budget exists in Preview.
    #     The owner ruled that absence of a global budget is ACCEPTED for
    #     Preview and is not a reason to remove the tool: the goal domain is
    #     reused as the UPSTREAM one (`@deepseek-ai/dsh-goal` +
    #     `dsh-goal-round-driver` + `dsh-tool-goal`), the Member keeps the
    #     upstream, Member-editable `maxGoalRounds`, and the Stop semantics
    #     (a stopped Member's goal must not start another automatic round) are
    #     measured live by PD-29. `tool-ask-user` stays OUT (PD-25's other
    #     finding: an unattended Member's question blocked the delegation).
    #     `tool-jobs` is retained but has no producer on this preset
    #     (the confined face cannot hand a command to the job registry); it
    #     answers from an OWNER-scoped registry, so a Member can only ever see
    #     its own (empty) list and a foreign job id is refused — PD-23 measured
    #     both live (`belongs to another session`, `unknown job <session-id>`).
    #   - the SKILLS LOADER is REMOVED by PD-23 (2026-11-14): `skill-filesystem`
    #     serves bodies from the BASE `fs` — preset rows mount on the registry
    #     generation scope, so no ctx handed to the preset changes a body's
    #     `fs` — and a live Member load of a `$DSH_HOME/skills` body returned its
    #     bytes with ZERO guard facts (that body then sat in 7 model requests).
    #     THE OPT-IN GOVERNED PRESET NOW OFFERS NO SKILLS AT ALL. That is a
    #     CAPABILITY REGRESSION, not an enforcement: a confined provider needs a
    #     `CORE_SEAM_BLOCKER`-class seam (see the PD-23 evidence README §5.1 for
    #     what would restore skills). `tool-skill` goes with it.
    #     PD-26 (2026-11-14) RESTORES the NAME and routes the READ: `tool-skill`
    #     is back, but with NO skill provider on this scope it can only answer
    #     "unknown" — it is a fail-closed PLACEHOLDER whose purpose is to keep
    #     the name on the model-visible surface. The realm's route-C attach
    #     re-mounts `confined-skill-tool.mjs` INSIDE the Member's isolated scope,
    #     where `ctx.fs` IS the confined provider: the declared catalog
    #     (`a5sfSkillCatalog`) is data, and every `SKILL.md` body is read through
    #     the compiled lane, so an out-of-lane body is a typed `IO_READ_DENIED`
    #     with one deny fact and zero bytes instead of a silent body. The attach
    #     REFUSES the Member setup if it cannot shadow this name.
    #   - `send_message`/`interrupt_agent`/`list_agents` were ALSO measured by
    #     PD-23 on the pre-merge base and could only refuse or lie there: the
    #     sibling and the Leader both failed the subagent lineage rule for
    #     `send_message`, `list_agents` reported only the caller's OWN (empty)
    #     children, and `interrupt_agent` answered a success-shaped `interrupt
    #     requested for agent …` for a target it never touched. They are absent
    #     on this head because the PD-21 group removal already took them.
    #   - NO base `persistent-shell`/`dsh-terminal` SERVICE row appears on this
    #     preset's scope. The persistent TOOL row above is a DEFINITION
    #     registration; the shell a governed Member actually runs is the realm
    #     lane's mount of the same host module INSIDE the Member's isolated
    #     scope, over the Member-bound governed PTY face. When the deployment
    #     composes the required ancestor `@deepseek-ai/dsh-terminal` (see
    #     above), the row activates on the preset scope over THAT service; the
    #     test worlds compose it with no PTY backend, so any use from the preset
    #     scope fails closed (`NO_BACKEND`, zero processes). The realm lane is
    #     not optional glue: it refuses a mount that leaves the Member resolving
    #     the inherited definition (`DEFINITION_UNCHANGED`, `vnext-realm-lane`),
    #     so a governed Member either gets the confined definition or its setup
    #     fails — it never silently inherits the preset-scope one. Mounting the
    #     base `persistent-shell`/`dsh-terminal` PAIR here instead would put an
    #     unconfined PTY on the preset's scope and turn the realm install into
    #     `TERMINALS_DOUBLE_TERMINAL_REFUSED`.
    - id: "preset-a5sf-governed-member"
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: "a5sf-governed-member"
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # ROUND 78 (rc.5 acceptance, deployment truth): `{{cwd}}` is NOT a
              # prompt variable on 0.2.2-rc.5 — its agent-loop registers only
              # `provider` and `model`, so an unregistered group makes EVERY turn
              # fail closed with `unknown prompt variable`. rc.2 happened to
              # register `cwd`; a composition must not depend on that. The
              # working directory is already stated by the runtime context, so
              # the suffix names it without a placeholder and behaves the same
              # on both hosts. (`{{model}}` below IS registered on both.)
              suffix: 'Your working directory is the session workspace. `bash` is a PERSISTENT shell: the current directory, exported environment variables and background processes survive across calls, so `cd`/`export` are durable. You cannot pass `workdir` or `timeoutMs`.'
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          # ROUND 76 — the HOST's own persistent definition (no Team copy, no
          # shadow module). The preset's own scope resolves whatever `terminals`
          # the DEPLOYMENT provides (this deployment mounts the host service with
          # no PTY backend, so the preset-scope definition is fail-closed); the
          # row exists so the governed realm lane can derive the module from the
          # preset's own rows and mount it INSIDE each Member's isolated scope,
          # where `ctx.terminals` IS the Member-bound governed PTY face.
          # `a5sf-governed-shell` is that face's registered backend
          # (`terminal-pty.ts`; the install default). The one-shot row above
          # remains the surface baseline the lane replaces.
          - id: tool-bash-persistent
            name: '@deepseek-ai/dsh-tool-bash-persistent'
            disabled: !!js process.platform === 'win32'
            config:
              backendType: a5sf-governed-shell
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # PD-26: the NAME-ONLY placeholders. Both rows are replaced inside the
          # Member's isolated scope by the route-C shadows (confined-skill-tool /
          # confined-present-tool); on this scope they are fail-closed, because
          # neither has a visible provider (skill) / a promise it can keep
          # (present is never reached once the attach refuses or shadows).
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          # PD-27 (2026-11-14): the NETWORK pair returns. This row is the
          # FAIL-CLOSED NAME HOLDER: on this preset scope its `ctx.web` is the
          # inherited base provider, so it registers the host package's own
          # `web_fetch`/`web_search` definitions over a REFUSING `web` view — the
          # name is on the model-visible surface and an unshadowed call is a typed
          # `NETWORK_UNCONFINED_REALM` with zero provider entries. The realm's
          # route-C attach re-mounts the SAME module inside the Member's isolated
          # scope, where `ctx.web` IS the confined face (PD-18's measured hole:
          # the preset row ran on the base provider with ZERO a5sf facts), so the
          # compiled `network` axis decides before any transport is entered.
          # The row is OUR module, never the host `tool-web` package: a host row
          # on this scope is ordinary ungoverned egress whenever the realm owns no
          # web face, which is exactly the hole PD-18 removed.
          #
          # A1 CUT (round 58): the row is GONE, and so is the module it named. The cut retired
          # `live/confined-web-tool.mjs` (a route-C SHADOW definition) because the new assembly mounts the
          # HOST's own `web_fetch` inside the member's realm lane and judges it on the compiled `network`
          # axis before the transport — a shadow is exactly what A1 forbids, and a preset row naming a
          # deleted module made WorldFactory refuse EVERY world with A5SF_PROFILE_GRAPH_UNRESOLVED while
          # `ute-cut-closure` stayed green (it does not scan this YAML/export reference class).
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          # PD-29 (2026-11-14 owner ruling): the goal tool is BACK. It is the
          # upstream `@deepseek-ai/dsh-tool-goal` row unchanged — `get_goal` /
          # `create_goal` / `update_goal` over the host's own `goals` service,
          # with the goal-round driver (`@deepseek-ai/dsh-goal-round-driver`,
          # a BASE bundle row, never on this preset) driving automatic rounds.
          # No Team-side round budget, no second policy source: the round cap
          # stays the upstream `maxGoalRounds` the Member itself may edit.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
