# ci-integration — EB3 layer 2 of 4: the static/product legs and the EB3 governance checks.
#
# WHAT IT IS FOR. The legs that need the built tree (typecheck), the orchestration
# state (graph-parse, state-freshness), and the four EB3 enforcement checks the plan
# names — required-job shape, trusted MCP sources, family definitions, family
# boundaries — plus the RUN Manifest validator. Each EB3 check is its own step so a
# failure names one law; all of them are also negative-controlled in
# scripts/eb3-ci-negative-controls.mjs, which is the leg that proves they can fail.
#
# WHY THE GOVERNANCE CHECKS ARE HERE AND NOT IN ci-fast. They are static (no host, no
# build of the nine packages), but they are not cheap-free: they read every tracked
# source file. ci-fast is the tier a developer waits on; this is the tier that decides
# whether the tree obeys its own laws, and it runs on every PR regardless of impact
# selection because a governance check that is skipped by a selector is a governance
# hole with a green tick.
#
# `--new` ON THE RUN MANIFEST is the strict mode: records CHANGED by this PR must bind
# the CURRENT authority generation and must be finalised; historical records are graded
# on internal honesty plus a generation that really exists.
name: ci-integration

on:
  # CALLED ONLY by .github/workflows/ci-required.yml. A layer with its own
  # pull_request trigger would run TWICE per PR (once standalone, once called), and
  # both runs would share a concurrency group, where GitHub cancels a PENDING run when
  # a newer one queues — i.e. a layer could report `cancelled` to the Required summary
  # through no fault of the change. One caller, one run, one result.
  workflow_call:
    inputs:
      merge_tree:
        description: tree id of the synthetic merge (base + head) this layer must grade
        type: string
        required: true
    # THE REUSABLE-WORKFLOW BOUNDARY. A job-level `outputs:` inside a called workflow is
    # NOT propagated to the caller — only `on.workflow_call.outputs` is. Without this the
    # caller's `needs.ci-integration.outputs.verdict` is empty and the aggregate reports
    # verdict-missing while every layer job is green (measured: hosted run 40346069026).
    outputs:
      verdict:
        description: this layer's EB3 verdict token (PASS|FAIL|CANCELLED)
        value: ${{ jobs.ci-integration.outputs.verdict }}
permissions:
  contents: read


jobs:
  ci-integration:
    name: ci-integration

    # THE OUTPUT CONTRACT with .github/workflows/ci-required.yml. The value is derived
    # from job.status so it cannot say PASS for a job GitHub calls a failure, and it is
    # finer-grained than success/failure so a refusal or an env-block is still visible.
    # THE OUTPUT CONTRACT with .github/workflows/ci-required.yml. `verdict` is the
    # value a final `if: always()` step writes from GitHub's OWN job status, so a layer
    # cannot report PASS for a job GitHub calls a failure. The `job` context is NOT
    # available in this `outputs:` block (it is available inside a step's `run`), which
    # is why the value is read from steps.<id>.outputs rather than computed here — the
    # same hosted-YAML discipline pr-gate.yml records learning from four silent
    # "workflow file issue" runs.
    outputs:
      verdict: ${{ steps.eb3_layer_verdict.outputs.verdict }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bind to the synthetic merge tree (EB3_MERGE_TREE)
        # The checkout is refs/pull/N/merge; its tree must equal the tree the summary's
        # synthesize job built independently, or this layer grades a different tree than
        # the Required context reports. ONE simple command, so the R2 leg allowlist can
        # prove it gates the step (the old shell `if`/`[ ] || { }` form could not be).
        env:
          EB3_EVENT: ${{ github.event_name }}
        run: node scripts/eb3-merge-tree.mjs --assert-tree "${{ inputs.merge_tree }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Resolve the change base
        # THE BASE IS THE MERGE REF'S FIRST PARENT, not event.pull_request.base.sha. PR #395's
        # third hosted run measured why: base.sha is where the branch was CUT, while the
        # checkout is refs/pull/N/merge built on the base branch's CURRENT tip, so
        # `git diff base.sha...HEAD` attributed every commit merged to master since the cut
        # (another lane's five RUN records) to THIS PR, and the strict RUN check refused
        # them as "new". HEAD^1 is exactly the tree this PR merges into, so the diff is
        # exactly this PR's changes. Same rule as the synthesize job in ci-required.yml.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [ "$EVENT_NAME" = "pull_request" ] || { echo "::error::ci-integration: event ${EVENT_NAME} is not supported — this layer is called by ci-required on pull_request only"; exit 1; }
          [ "$(git rev-list --parents -n1 HEAD | wc -w)" = "3" ] || { echo "::error::ci-integration: the checkout is not a two-parent merge commit — expected refs/pull/N/merge"; exit 1; }
          BASE=$(git rev-parse 'HEAD^1')
          echo "CI_BASE=$BASE" >> "$GITHUB_ENV"
          echo "ci-integration base = $BASE (merge ref first parent)"

      - name: Ensure a YAML parser for the graph leg
        run: |
          python3 -c 'import yaml' 2>/dev/null && echo "PyYAML present" || python3 -m pip install --quiet pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      # ── the four EB3 governance checks, one step each ──────────────────────────
      - name: "EB3-C: required-job shape (layers present, triggered, non-skippable, summarised)"
        run: node scripts/eb3-ci-required.mjs

      - name: "EB3-A/D: trusted MCP tool sources (an unbooked mcp__ tool is UNKNOWN, never authorised)"
        run: node scripts/eb3-trusted-sources.mjs

      - name: "EB3-A: family execution Definitions (via arm, transport, readable names, census)"
        run: node scripts/eb3-family-definitions.mjs

      - name: "EB3-A: family boundaries (a sibling lane's internals and the centre are not edges)"
        run: node scripts/eb3-family-boundaries.mjs

      - name: "EB3-D: RUN Manifest (sources, host pin, authority generation, case algebra, evidence)"
        shell: bash
        # ONE simple command (R2 F-2 allowlist): the script computes this PR's new records
        # from --new-since itself, instead of a shell `if` choosing between invocations.
        run: |
          set -euo pipefail
          node scripts/eb3-run-manifest.mjs --new-since "$CI_BASE"

      - name: "EB3 evidence guard (no raw census capture, no unexempted file > 1 MiB added under evidence/)"
        shell: bash
        # ONE simple command, same base as the RUN Manifest step: the added set is
        # `git diff --diff-filter=A $CI_BASE...HEAD -- dev/agent-workflow/evidence/`.
        run: |
          set -euo pipefail
          node scripts/eb3-evidence-guard.mjs --new-since "$CI_BASE"

      - name: "EB3 negative controls (each enforcement check must be able to fail)"
        # The four detections the plan names, plus the five non-green summary states and
        # the two preserved positives. Exits non-zero the moment one of them stops
        # detecting — this is the leg that keeps the other legs honest.
        run: node scripts/eb3-ci-negative-controls.mjs

      - name: "EB3 acceptance ledger (per-tool four levels; every PROVEN level backed by a committed RUN record case PASS)"
        # PR #404 merged with its live C2 RUN record at overall=FAIL (3 PASS / 3 FAIL)
        # while every layer was green: nothing machine-checked "the Definition passes"
        # against "the real positive effect ran on a Host". This leg refuses a PROVEN
        # level that no committed RUN record case backs. It deliberately does NOT fail on
        # DISCLOSED / NOT_VERIFIED — honesty is the merge gate, completeness (every L4
        # PROVEN) is the G5 release gate.
        run: node scripts/eb3-tool-acceptance.mjs

      - name: "EB4-B/D/E tooling suites (devex, integration-order, diag-call-chain — node:test, host-free)"
        # Declared as a leg in dev/ci/eb3-ci-manifest.json with both paths as required tokens:
        # dropping either file from this line is CI_LAYER_LEG_WEAKENED. They shipped in PR #394 in
        # no layer, which is how two of their defects reached master unseen.
        run: node --test tests/u7-3-devex/devex-integration.test.mjs tests/diag-call-chain/diag-call-chain.test.mjs

      - name: "tests/checks node:test suites (dist-placements, eslint-node-globals — host-free)"
        # u7-fixfwd (2026-10-27): declared as a leg with both file paths as required tokens.
        # dist-placements.test.mjs was 4/5 fail on clean master and no CI ran it;
        # eslint-node-globals.test.mjs had the same exposure. Dropping either path is
        # CI_LAYER_LEG_WEAKENED. New tests/checks suites join this step AND the manifest leg.
        run: node --test tests/checks/dist-placements.test.mjs tests/checks/eslint-node-globals.test.mjs

      - name: "scripts node:test suite (eb3-tool-acceptance law fixtures — host-free)"
        # a5w-law1 (2026-10-31): the #529 review seat proved no CI leg collected
        # scripts/eb3-tool-acceptance.test.mjs — weakening containsVerbatim to always-true
        # kept every layer green. This step puts the checker's law fixtures ((m) red,
        # (n) whitespace-normalized green, (o) self-proving copy-tree mutation control)
        # under CI; declared in dev/ci/eb3-ci-manifest.json with the file path as a
        # required token. Dropping it is CI_LAYER_LEG_WEAKENED.
        run: node --test scripts/eb3-tool-acceptance.test.mjs

      - name: "a5sf harness C1 (R2/BL-10 — node:test, zero Host boots, host-free)"
        # BL-10/R2: the Sandbox-First suites ride the pre-existing factory/oracle/CI
        # machinery, so the harness wiring needs a C1 proof of its own. This step is the
        # minimal wiring: ci-integration lists node:test files EXPLICITLY, so a new C1
        # suite would otherwise be invisible to every layer (the #394 and #529 incidents
        # were exactly that). Declared in dev/ci/eb3-ci-manifest.json with the file path
        # as a required token; dropping it is CI_LAYER_LEG_WEAKENED.
        # Host-free: no port, no DSH_HOME, no pristine host tree — the pinned candidate is
        # READ from tests/paths.mjs as a constant, never resolved into a checkout.
        run: node --test tests/world-factory/a5sf-harness.test.mjs

      - name: "a5sf evidence chain R3 (BL-11 — node:test, host-free, records the four links and re-reads them with a5sf-diag)"
        # BL-11/R3: one evidence chain PER CALL — the durable Alpha.4 consumption row, the
        # compiled MemberPolicy + EffectiveIo (the ONE computation), the Provider the
        # installer mounted, and the independent oracle effect — aligned on one member
        # instance + generation + invocation id + operation identity. The suite also runs
        # the R4 reader (`scripts/a5sf-diag.mjs`) on the recorded JSONL, so the row schema
        # is a measured contract, not a declaration. ci-integration lists node:test files
        # EXPLICITLY (the #394 / #529 incidents were files no layer collected), so without
        # this step the chain laws run in NO layer. The file path is a required token in
        # dev/ci/eb3-ci-manifest.json; dropping it is CI_LAYER_LEG_WEAKENED.
        # Host-free: a durable P6-T4 UNIT world (real ControlService, no Host boot), no
        # port, no DSH_HOME, no pristine host tree; the P1 TS seams load through the
        # repo's existing scripts/run-tests-hooks.mjs (no new loader, no build).
        run: node --test tests/world-factory/a5sf-evidence.test.mjs

      - name: "a5sf golden-vector regression corpus (R5/BL-13 — node:test, host-free)"
        # BL-13/R5: the retired family output vectors were converted into a regression
        # comparison corpus for the new lanes. ci-integration lists node:test files
        # EXPLICITLY (the #394 / #529 lesson), so without this step the comparator's
        # refusal laws would run in NO layer. Declared in dev/ci/eb3-ci-manifest.json
        # with the file path as a required token; dropping it is CI_LAYER_LEG_WEAKENED.
        # This is NOT an acceptance gate: a MATCH is a regression comparison only.
        # Host-free: no port, no DSH_HOME, no pristine host tree; the P1 path algebra
        # loads through the repo's existing scripts/run-tests-hooks.mjs (no new loader).
        run: node --test tests/kits/a5sf-golden/compare.test.mjs

      - name: "a5sf diag R4 (BL-12 — node:test, host-free, delegates to the PR #394 classifier)"
        # BL-12/R4: the approval-bypass / failure-classification report reuses the PR #394
        # diagnostics (`scripts/diag-call-chain.mjs`) and the P1 locator algebra instead of
        # creating a second vocabulary or a second matcher. ci-integration lists node:test
        # files EXPLICITLY (the #394 and #529 incidents were files no layer collected), so
        # the suite needs this step; the file path is a required token in
        # dev/ci/eb3-ci-manifest.json and dropping it is CI_LAYER_LEG_WEAKENED.
        # Host-free: fixtures are JSONL rows under tests/a5sf-diag/fixtures — no boot, no
        # port, no DSH_HOME, no pristine host tree.
        run: node --test tests/a5sf-diag/a5sf-diag.test.mjs

      - name: "a5sf read budget gate C1 (P2-01/BL-14 — node:test, zero Host boots, host-free)"
        # BL-14/P2-01 is the FIRST P2 vertical slice and the template for BL-15…BL-20: a
        # native `read` allowed inside a compiled ceiling, refused outside it, and a
        # per-run BUDGET PRE-REGISTRATION gate (recorded grant: grantId / maxStarts /
        # grantedBy / boundCommit) that refuses with BUDGET_NOT_GRANTED — absent,
        # malformed, ambiguous, foreign-commit, too-small or exhausted — BEFORE any
        # World exists or any start row is appended. The C2 half needs a real Host and a
        # live read driver this tree does not have; this step is the half that must run
        # on every PR. ci-integration lists node:test files EXPLICITLY (the #394 / #529
        # incidents were files no layer collected), so without this step the gate's laws
        # run in NO layer. The file path is a required token in
        # dev/ci/eb3-ci-manifest.json; dropping it is CI_LAYER_LEG_WEAKENED.
        # Host-free: a real run record over a temp JSONL ledger + a recording boot stub —
        # no boot, no port, no DSH_HOME, no pristine host tree, no workspace runtime.
        run: node --test tests/world-factory/a5sf-read-gate.test.mjs

      - name: "a5sf P2 seam C1 (BL-14/P2-01 follow-up — node:test, zero Host boots, host-free, cross-process transport)"
        # The P2 blocking seam: the shipped guard's consultation must be MECHANICALLY
        # OBSERVABLE (the installer used to build the closure and never return it) and the
        # record must cross a PROCESS BOUNDARY (an in-process callback cannot reach a C2
        # suite in another process). This step pins the additive default-preserving installer
        # input, one record per consultation carrying the guard's own decision, the plain
        # append-only JSONL sink + strict reader, the negative control (no consultation writes
        # nothing), fail-closed transport (an unrecorded decision refuses the call), the ONE
        # mount entry point `mountA5sfRealm` (the harness `mountRealm()` is its caller), and a
        # CHILD process that mounts the realm and writes the sink THIS process reads back.
        # ci-integration lists node:test files EXPLICITLY (the #394 / #529 incidents were files
        # no layer collected), so without this step the seam's laws run in NO layer. The file
        # path is a required token in dev/ci/eb3-ci-manifest.json; dropping it is
        # CI_LAYER_LEG_WEAKENED. Host-free: an in-process Cordis unit root and mkdtemp
        # fixtures — no boot, no port, no DSH_HOME, no pristine host tree.
        run: node --test tests/world-factory/a5sf-p2-seam.test.mjs

      - name: "a5sf P2 WIRING C1 (product-row call site — node:test, zero Host boots, host-free)"
        # The PRODUCT-ROW half of the P2 seam: the mechanism landed in #548 but no product
        # code called it, so the compiled realm was INERT in a booted Host, and the emit did
        # not carry the lane. This step pins the wiring that closed that: the live Member
        # setup's exported helper (`packages/runtime/src/plugin/live/a5sf-realm-row.mjs`)
        # mounts the compiled realm through the ONE entry point with a sink whose path comes
        # from ROW CONFIG, writes ONE fact per consultation with the expected schema, releases
        # both realms on dispose, does NOTHING when either half of the wiring is absent (the
        # legacy path), and fails CLOSED when the sink cannot write (the consulted call never
        # reaches the base Provider). It also structurally pins the guarded call site in
        # `agent-bindings.mjs` and the row-kept disposer. ci-integration lists node:test files
        # EXPLICITLY (the #394 / #529 incidents were files no layer collected), so without this
        # step the wiring's laws run in NO layer. The file path is a required token in
        # dev/ci/eb3-ci-manifest.json; dropping it is CI_LAYER_LEG_WEAKENED. Host-free: an
        # in-process Cordis unit root and mkdtemp fixtures — no boot, no port, no DSH_HOME.
        run: node --test tests/world-factory/a5sf-p2-wiring.test.mjs

      # ── the pre-existing legs, unchanged ──────────────────────────────────────
      - name: Gate legs — graph-parse + state-freshness
        # The SAME script and the same legs pr-gate runs, so "what CI runs" and "what
        # the merge gate runs" stay one list. --only keeps this to the two state legs;
        # typecheck has its own step below (it needs the build, the state legs do not).
        run: node scripts/ci-pr-gate.mjs --only graph-parse --only state-freshness

      - name: Typecheck (all packages, tests included — tsc is the only leg that sees a bad .test.ts)
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          pnpm typecheck

      - name: Layer verdict token (feeds the Required summary; runs even when a step above failed)
        id: eb3_layer_verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${{ job.status }}" in
            success) V=PASS ;;
            cancelled) V=CANCELLED ;;
            *) V=FAIL ;;
          esac
          echo "EB3-LAYER layer=ci-integration verdict=$V status=${{ job.status }}"
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
