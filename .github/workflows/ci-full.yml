# ci-full — EB3 layer 4 of 4: the whole gate, census included.
#
# WHAT IT IS FOR. The legs that need the PINNED PRISTINE HOST: the nine-root census
# with its known-old-red identity set, and pr-gate's remaining legs (install,
# blueprint-fence, lint identities, artifacts-at-head). It runs `ci-pr-gate.mjs
# --full` with NO `--allow-refused`, so a leg that cannot be graded is a RED here.
#
# THE HONEST TRADE THIS LAYER MAKES. On a hosted runner the pristine host is absent
# (tests/deepseek-harness-test-use is gitignored, docs/TEST_METHODS.md §2). pr-gate
# solves that by declaring `--allow-refused census`, which is honest but means the
# single Required context never measures the population. This layer instead
# PROVISIONS the host from its pin (the same chain census-runtime.yml uses) and fails
# if provisioning or the pin assertion fails — so ci-full's green does mean the census
# ran, and a refusal is not available to it.
#
# NOTHING HERE IS "JUST SLOWER". The census grades IDENTITY SETS against
# dev/agent-workflow/evidence/a4-pr7/population-baseline/nine-root-2b1099d7.md: a new
# red fails, and so does a red that vanished into a collection error (an escalation,
# not a fix). A layer that only re-ran the fast checks would be a second name for
# ci-fast.
name: ci-full

on:
  # CALLED ONLY by .github/workflows/ci-required.yml. A layer with its own
  # pull_request trigger would run TWICE per PR (once standalone, once called), and
  # both runs would share a concurrency group, where GitHub cancels a PENDING run when
  # a newer one queues — i.e. a layer could report `cancelled` to the Required summary
  # through no fault of the change. One caller, one run, one result.
  workflow_call:
    inputs:
      merge_tree:
        description: tree id of the synthetic merge (base + head) this layer must grade
        type: string
        required: true

permissions:
  contents: read


jobs:
  ci-full:
    name: ci-full

    # THE OUTPUT CONTRACT with .github/workflows/ci-required.yml. The value is derived
    # from job.status so it cannot say PASS for a job GitHub calls a failure, and it is
    # finer-grained than success/failure so a refusal or an env-block is still visible.
    # THE OUTPUT CONTRACT with .github/workflows/ci-required.yml. `verdict` is the
    # value a final `if: always()` step writes from GitHub's OWN job status, so a layer
    # cannot report PASS for a job GitHub calls a failure. The `job` context is NOT
    # available in this `outputs:` block (it is available inside a step's `run`), which
    # is why the value is read from steps.<id>.outputs rather than computed here — the
    # same hosted-YAML discipline pr-gate.yml records learning from four silent
    # "workflow file issue" runs.
    outputs:
      verdict: ${{ steps.eb3_layer_verdict.outputs.verdict }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind to the synthetic merge tree (EB3_MERGE_TREE)
        # The layer grades what WOULD land. On pull_request the default checkout is
        # GitHub's merge ref; on push it is the pushed tip (whose merge with its own
        # parent is itself). Either way its TREE must equal the tree the summary's
        # synthesize job built independently with `git merge-tree`; a mismatch means
        # this layer is grading a different tree than the Required context reports.
        shell: bash
        env:
          EB3_MERGE_TREE: ${{ inputs.merge_tree }}
        run: |
          set -euo pipefail
          GOT=$(git rev-parse 'HEAD^{tree}')
          [ -n "$EB3_MERGE_TREE" ] || { echo "::error::no merge_tree input — this layer was not called by ci-required"; exit 1; }
          [ "$GOT" = "$EB3_MERGE_TREE" ] || { echo "::error::checked-out tree $GOT != synthetic merge tree $EB3_MERGE_TREE"; exit 1; }
          echo "grading synthetic merge tree $GOT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Resolve the pinned pristine host from tests/paths.mjs
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(node -e "import('./tests/paths.mjs').then((m) => console.log(m.TEST_USE_BASELINE_SHA))")
          VER=$(node -e "import('./tests/paths.mjs').then((m) => console.log(m.DSH_BASELINE_VERSION))")
          CH=$(node -e "import('./tests/paths.mjs').then((m) => console.log(m.CLIENT_COMMIT_HASH))")
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tests/paths.mjs gave no 40-hex TEST_USE_BASELINE_SHA (got '$SHA')"; exit 1; }
          echo "TEST_USE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "TEST_USE_VERSION=$VER" >> "$GITHUB_ENV"
          echo "TEST_USE_CLIENT_HASH=$CH" >> "$GITHUB_ENV"
          echo "pinned pristine host: $SHA = $VER (client commit $CH)"

      - name: Provision the pinned pristine test host
        shell: bash
        env:
          HOST_URL: https://github.com/ArmourPiercer1/deepseek-harness
          HOST_BRANCH: stable-3-0.2.0-rc.2
          HOST_DIR: tests/deepseek-harness-test-use
        run: |
          set -euo pipefail
          mkdir -p "$HOST_DIR"
          git -C "$HOST_DIR" init -q .
          git -C "$HOST_DIR" remote add origin "$HOST_URL"
          if ! git -C "$HOST_DIR" fetch -q --depth 1 --no-tags origin "$TEST_USE_SHA"; then
            echo "::warning::exact-SHA fetch refused; falling back to the branch tip — the assertion below fails the job if the tip is not the pin"
            git -C "$HOST_DIR" fetch -q --depth 1 --no-tags origin "$HOST_BRANCH"
          fi
          git -C "$HOST_DIR" checkout -q --detach FETCH_HEAD
          HEAD_SHA=$(git -C "$HOST_DIR" rev-parse HEAD)
          [ "$HEAD_SHA" = "$TEST_USE_SHA" ] || { echo "::error::PRISTINE HOST DRIFT: checked out $HEAD_SHA but tests/paths.mjs pins $TEST_USE_SHA"; exit 1; }
          DIRTY=$(git -C "$HOST_DIR" status --porcelain | wc -l)
          [ "$DIRTY" = "0" ] || { echo "::error::pristine host checkout is not clean after detach ($DIRTY porcelain line(s))"; exit 1; }
          echo "provisioned pristine host $HEAD_SHA (porcelain clean)"

      - name: Build the pristine host (TEST_METHODS §2 chain)
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
          HOST_DIR: tests/deepseek-harness-test-use
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          cd "$HOST_DIR"
          pnpm install --ignore-scripts --store-dir "$PNPM_STORE_DIR"
          ESBUILD_WORKER_THREADS=1 DSH_CLIENT_COMMIT_HASH="$TEST_USE_CLIENT_HASH" pnpm run build
          cd "$GITHUB_WORKSPACE"
          [ -f "$HOST_DIR/apps/cli/lib/bin.js" ] || { echo "::error::host build exited 0 but produced no $HOST_DIR/apps/cli/lib/bin.js"; exit 1; }
          BUILT_SHA=$(git -C "$HOST_DIR" rev-parse HEAD)
          [ "$BUILT_SHA" = "$TEST_USE_SHA" ] || { echo "::error::PRISTINE HOST DRIFT AFTER BUILD: $BUILT_SHA vs pin $TEST_USE_SHA"; exit 1; }
          echo "host build ok at $BUILT_SHA"

      - name: Build this repo (packages + composition) — the census leg REFUSES without this
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
          pnpm run build
          pnpm build:composition

      # Security controls that resolve the PINNED HOST and so cannot run in the host-free
      # ci-security layer (list + reason: tests/checks/eb3-host-security-suites.txt;
      # the move is recorded in dev/ci/eb3-ci-manifest.json movedSuites). Token-graded,
      # and before the census so a registry-drift red is named on its own line.
      - name: Host-provisioned security suites (moved from ci-security; needs the pinned host)
        run: node scripts/eb3-security-run.mjs --layer ci-full --list-file tests/checks/eb3-host-security-suites.txt --timeout 20000

      - name: Ensure a YAML parser for the graph leg
        run: |
          python3 -c 'import yaml' 2>/dev/null && echo "PyYAML present" || python3 -m pip install --quiet pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      # ONE command, the SAME one pr-gate runs — and the one difference that makes this
      # layer worth its cost: no `--allow-refused`. A leg that cannot be graded reddens
      # this layer instead of being declared away.
      #
      # `set -o pipefail` is load-bearing (`node … | tee …` otherwise reports tee's
      # status, turning a red gate green; pr-gate FINDINGS F2).
      - name: Gate — every leg, two captures, ANY skip and ANY refusal is a failure
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          DSH_CI_STORE_DIR: ${{ runner.temp }}/pnpm-store
        run: |
          set -o pipefail
          mkdir -p "$XDG_CACHE_HOME"
          node scripts/ci-pr-gate.mjs --full \
            --census-captures 2 \
            --census-test-timeout 90000 \
            --store-dir "$DSH_CI_STORE_DIR" \
            --transcript-dir "$RUNNER_TEMP/gate-transcripts" \
            2>&1 | tee "$RUNNER_TEMP/gate-run.txt"

      - name: Gate — re-grade the transcript by the missing-token rule
        shell: bash
        if: always()
        run: node scripts/ci-pr-gate.mjs --check-transcript "$RUNNER_TEMP/gate-run.txt"

      - name: Upload gate transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-transcripts-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/gate-run.txt
            ${{ runner.temp }}/gate-transcripts/
          if-no-files-found: warn

      - name: Layer verdict token (feeds the Required summary; runs even when a step above failed)
        id: eb3_layer_verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${{ job.status }}" in
            success) V=PASS ;;
            cancelled) V=CANCELLED ;;
            *) V=FAIL ;;
          esac
          echo "EB3-LAYER layer=ci-full verdict=$V status=${{ job.status }}"
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
