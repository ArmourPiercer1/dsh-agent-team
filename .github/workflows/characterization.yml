# P2-T1 — pristine characterization CI job
#
# Runs the P2-T1 characterization harness (tests/characterization) against a
# pristine, pinned checkout of upstream deepseek-ai/deepseek-harness.
#
# Pin: fb2c4b9e69 (0.1.5-rc.2 official release point) since 2026-09-17
# (rc2-repair closure, user-directed; DSH 0.1.2 no longer supported).
#
# The harness self-test is ONE command:
#
#   node tests/characterization/run.mjs
#
# It boots the pinned upstream through its public exports only, verifies the
# host-version fixture, exercises the probe lifecycle (including a
# private-import negative control that must fail boot loudly), and finally
# asserts the upstream tree is byte-clean (git status --porcelain empty and
# git diff empty) after the run.
#
# Note: this job was authored for CI; per the P2-T1 task brief it was NOT
# executed in the local authoring environment. The local equivalent command
# (`node tests/characterization/run.mjs` against the pinned tree) is all-green
# — see dev/agent-workflow/evidence/P2-T1/ (run-all.log, summary.json).

name: characterization

# 2026-09-17 (rc2-repair closure, user-directed): the ACTIVE gate is demoted
# to manual (workflow_dispatch only). Why: the pin infrastructure was
# migrated to fb2c4b9e (0.1.5-rc.2) — checkout ref, DSH_CLIENT_COMMIT_HASH,
# the pin-drift fixture re-recorded via --fixture-write, and the build step
# moved to `pnpm run build` (the npm_execpath contract that made every
# pre-migration run red at the build step, PR #16/#17/#18). But the P2-era
# probes were characterized against cd5ef814 (0.1.2-alpha.1) and the
# full local self-test on the new pin fails in the probe section with three
# identified root causes (evidence:
# dev/agent-workflow/evidence/rc2-repair/ci-migration-local/, 107 failing
# checks): (1) p2t2/p2t3 probes hardcode the 0.1.2 session-log artifact
# name `session.jsonl.zstd` — 0.1.5-rc.2 durably publishes
# `session.v3.jsonl.zstd`; (2) the p2t4 capabilities probe reads
# `tools.schemas()` in a row scope where 0.1.5 returns undefined
# (host-surface contract drift, probe rewrite needed); (3) the p2t5
# remote probe's B1/B2 instance boots exit code=1 (log overwritten by the
# harness's per-port reuse; needs a re-run with retained failure logs).
# Re-characterizing the probes against 0.1.5-rc.2 is a bounded follow-up
# task (its own scope + evidence), not a closure step. Until then this job
# is archival/manual: run it on demand for infrastructure validation; it is
# NOT a merge gate. The repo's active gates remain the workspace test
# suite + the real-host smoke kit (tests/kits/rc2-real-host-smoke).
on:
  workflow_dispatch:

concurrency:
  group: characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    name: P2-T1 characterization on pristine upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout team repo
        uses: actions/checkout@v4

      # The pinned pristine upstream tree, at the exact SHA recorded in
      # tests/characterization/fixtures/host-version.json (upstreamSha).
      # fetch-depth: 0 — the ref is a bare SHA, so full history is fetched.
      # 2026-09-17 (rc2-repair closure, user-directed): pin migrated from
      # cd5ef814 (0.1.2-alpha.1, P2-era) to fb2c4b9e69 (0.1.5-rc.2 official
      # release point — DSH 0.1.2 is no longer supported); the pin-drift
      # fixture was re-recorded on the new pin via --fixture-write with the
      # full self-test green against the new tree (evidence:
      # dev/agent-workflow/evidence/rc2-repair/ci-migration-local/).
      - name: Checkout pinned pristine upstream (test-use tree)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: fb2c4b9e698e30edb738bca4cf0618587db7d203
          path: tests/deepseek-harness-test-use
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # TEST_METHODS.md §2 launch chain (same chain as the local sandbox, so
      # CI and local evidence stay comparable):
      #   --ignore-scripts skips lifecycle scripts; prebuilt native binaries
      #   (node-pty/koffi/esbuild platform packages) are unaffected.
      - name: Install upstream dependencies (no lifecycle scripts)
        working-directory: tests/deepseek-harness-test-use
        run: pnpm install --ignore-scripts

      # Build the runtime closure. DSH_CLIENT_COMMIT_HASH skips the git spawn
      # inside the build orchestrator; ESBUILD_WORKER_THREADS=1 keeps esbuild
      # off child-process spawn (sandbox parity; harmless on CI runners).
      # Invoked through `pnpm run` (NOT bare `node scripts/build.ts`): the
      # 0.1.5 build orchestrator resolves child pnpm invocations from
      # npm_execpath, which only exists when the script runs inside a pnpm
      # lifecycle — a direct node invocation throws "pnpm invocation:
      # npm_execpath is unavailable" (the pre-migration CI red, runs
      # 34775318796..35239888899).
      - name: Build upstream runtime closure (TEST_METHODS §2)
        working-directory: tests/deepseek-harness-test-use
        env:
          DSH_CLIENT_COMMIT_HASH: fb2c4b9e69
          ESBUILD_WORKER_THREADS: "1"
        run: pnpm run build

      # The one-command self-test. cwd = team repo root, which is what the
      # harness's findTeamRoot expects (tests/deepseek-harness-test-use
      # beside tests/characterization). Evidence lands in
      # dev/agent-workflow/evidence/P2-T1/ under the workspace root.
      - name: Run characterization self-test (one command)
        env:
          CH_DSH_HOME: ${{ github.workspace }}/tests/homes/.dsh-test-p2t1
        run: node tests/characterization/run.mjs --report-dir dev/agent-workflow/evidence/P2-T1

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2t1-characterization-evidence
          path: dev/agent-workflow/evidence/P2-T1/
          if-no-files-found: ignore
