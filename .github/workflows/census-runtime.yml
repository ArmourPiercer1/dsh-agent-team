# A4 external review item 4 — the census RUNTIME gate: the second, honest green.
#
# WHY A SECOND WORKFLOW INSTEAD OF FIXING `pr-gate`. `pr-gate` runs 7 legs and passes today with
# `refused=1 refusedlegs=census`: its census leg REFUSES, honestly and out loud, because the
# gitignored pristine test host (`tests/deepseek-harness-test-use`, TEST_METHODS §2) is absent from
# a runner checkout, and the 57 legs that resolve it are ungradeable without it (hosted run
# 37794562230 produced 57 failures wearing the product's name for exactly that absence). A refusal
# is the right answer for THAT job — but a gate that cannot run must not share one green state with
# a gate that passed, and no amount of `refusedlegs=census` prose makes a reader's "CI is green"
# mean "the nine-root census ran". So this file changes no verdict `pr-gate` already gives (its
# semantics are untouched, including its declared exemption) and adds the check that has to be true
# for the census to be believed: a run that PROVISIONS the pinned host, and where a refusal is a
# FAILURE. Two names, two meanings: `pr-gate` = static + build legs, census declared-refused;
# `census-runtime` = the census ran against the pinned host, no refusal permitted.
#
# NO NEW GATE CODE. `scripts/ci-pr-gate.mjs` already refuses to grade a missing host and already
# turns an UNDECLARED refusal into a named failure (`undeclared refusal — … declare it:
# --allow-refused census`, pinned by `--self-test`). This job therefore only withholds the
# exemption: it passes no `--allow-refused`, so a host that fails to provision cannot come back
# green — it comes back `verdict=fail` on the leg line, and the transcript re-grade step grades the
# same claim a second time.
#
# WHY THE HOST IS PROVISIONABLE ON A RUNNER AT ALL. The local checkout's `origin` is a local path
# (the read-only shared baseline), which is why this looked un-provisionable from a sandbox. Its
# upstream is PUBLIC: `https://github.com/ArmourPiercer1/deepseek-harness`, branch
# `stable-3-0.2.0-rc.2`, whose tip IS the pinned SHA — re-confirmed 2026-10-08 (UTC) from this sandbox
# (`git ls-remote … stable-3-0.2.0-rc.2` → `639ed015397290b3745d163aafe02ffee4aa3f84`), and the
# exact-SHA shallow fetch used below was executed here, not assumed (evidence
# `dev/agent-workflow/evidence/a4-pr7/census-runtime/PROVISION-PROBE.txt`). No secret, no token,
# `permissions: contents: read` and nothing else.
#
# THE PIN IS READ, NEVER COPIED. `tests/paths.mjs` is the declared single source of truth for
# `TEST_USE_BASELINE_SHA` / `DSH_BASELINE_VERSION` / `CLIENT_COMMIT_HASH`, so this file parses them
# at run time. Hardcoding the SHA here would create a second pin that can drift from the one the
# suite resolves — which is the exact failure this job exists to catch. The URL and the branch NAME
# are written here because they are transport, not the pin: the branch is only the fallback ref,
# and the assertion after the fetch is what decides, so a moved branch tip FAILS this job by name
# instead of silently testing a different host.
#
# EVERY `run:` BLOCK SAYS `set -euo pipefail`. Actions already runs a block under `bash -e`, but a
# step whose safety depends on an implicit default is one `shell:` edit away from not failing: the
# end-to-end local simulation (e2e-provision-run.sh → E2E-PROVISION-THEN-CENSUS.txt) reproduced
# precisely this — with the provisioning step's failure ignored, the NEXT step's `cd "$HOST_DIR"`
# failed quietly and the step built the WRONG tree (this repo instead of the host) and reported
# success. Writing `-e` down makes a `cd` that cannot land abort the step, makes the text behave the
# same when a reviewer runs it by hand, and keeps `| tee` from substituting tee's exit status for
# the gate's (FINDINGS F2).
name: census-runtime

on:
  # CALLED ONLY by .github/workflows/ci-required.yml (2026-11-03 CI-cost split). The
  # standalone `pull_request`/`push`/`workflow_dispatch` triggers are RETIRED: while this
  # job had its own PR trigger it ran a second full census alongside the aggregate's trusted
  # census, on every PR, for a check branch protection does not require. One caller, one
  # run, one result — and the caller is Required, so the census now gates merges instead
  # of merely being available.
  workflow_call:
    inputs:
      merge_tree:
        description: tree id of the synthetic merge (base + head) this layer must grade
        type: string
        required: true
    outputs:
      verdict:
        description: this layer's EB3 verdict token (PASS|FAIL|CANCELLED)
        value: ${{ jobs.census-runtime.outputs.verdict }}

permissions:
  contents: read

concurrency:
  group: census-runtime-${{ github.ref }}
  # cancel-in-progress FALSE. This job used to be informational and was allowed to cancel a
  # superseded run; it is now a required LAYER of the Required `ci-required` aggregate, so a
  # cancelled run reports `cancelled`, which is neither green nor red and would leave the merge
  # verdict unreadable on the head the PR is actually at. The aggregate's own concurrency group
  # already keeps one run per ref; a queued run replacing a pending one is fine, cancelling a
  # RUNNING one is not.
  cancel-in-progress: false

jobs:
  census-runtime:
    # The required-check context string, same rule as `pr-gate`: short, ASCII, typeable.
    name: census-runtime
    runs-on: ubuntu-latest
    # MEASURED, not guessed — and it is a FLOOR with its provenance, because no sandbox can measure
    # a 2-core runner. The whole job was run as ONE local sequence (E2E-PROVISION-THEN-CENSUS.txt:
    # throwaway directory, host fetched from github.com in the moment, each step given the `env:` the
    # runner would give it): pin resolve 0 s + provision 8 s + host build 218 s + census (2 captures,
    # --testTimeout=20000) 254.8 s + re-grade 0 s = 481 s ≈ 8 minutes, plus the Actions harness this
    # sandbox cannot run (checkout, setup-node, setup-pnpm, cold pnpm downloads of BOTH trees,
    # artifact upload). Component figures and a second, independent provisioning probe are in
    # dev/agent-workflow/evidence/a4-pr7/census-runtime/MEASURED-TIMINGS.txt.
    # The one hosted fact for the factor: `pr-gate`'s 7-leg run took 475.3 s on `ubuntu-latest`
    # against 222.4 s locally for the SAME legs while doing strictly LESS work (its census refused),
    # so 2–4x per leg is conservative, and the census is the part that scales with cores because each
    # capture spawns real DSH hosts. 4x the local floor is ~32 min; 60 leaves room for cold pnpm
    # downloads and a slow census without turning "grading" into "stuck". A timeout expiry is itself
    # a legible verdict — the job then says "could not grade in 60 minutes" instead of pretending to
    # abstain — so this margin costs queue time, never correctness. NARROW IT from the first hosted
    # run's per-step timings; that is the one measurement this lane cannot make.
    # 90, not 60, since 2026-11-19 (Task B): the measured L2 floor is ~24 min today and the
    # next-host lane adds a SECOND host provisioning + build (clone + install + build: 130 s
    # measured locally, 2–4x hosted) plus one boot. 90 keeps the same order of headroom over
    # the new floor instead of tightening it; a timeout expiry is still a legible verdict.
    timeout-minutes: 90
    # The value is derived from job.status inside an `if: always()` step, so a layer cannot
    # report PASS for a job GitHub calls a failure.
    outputs:
      verdict: ${{ steps.eb3_layer_verdict.outputs.verdict }}
    env:
      # ONLY `CI` here. `runner` is not an available context in `jobs.<id>.env` (permitted: github,
      # inputs, matrix, needs, secrets, strategy, vars), and GitHub's answer to a file that asks
      # anyway is a failed run with NO jobs and no log — measured four times over on `pr-gate` (see
      # the note in that file, and FINDINGS.md §"four job-less runs"). Every step below that wants
      # `runner.temp` sets it at step level, where the context is legal.
      CI: 'true'
    steps:
      - name: Checkout
        # fetch-depth 0 (full history) — CORRECTED 2026-10-22 by root ruling; the previous comment
        # here claimed the only git read was `rev-parse --short HEAD` and that depth 1 sufficed.
        # That was FALSE, and it went red: the census suite's lineage/ancestor checks walk real git
        # ancestry (state-freshness test :406), and on the depth-1 checkout the round-58 pointer
        # reported `a23e5c8f is not reachable from HEAD` — a shallow-clone artifact wearing the
        # product's name (the Actions merge checkout @15d7e95c composes with --depth=1). The census
        # therefore NEEDS the ancestor facts reachable, so the clone is full. The unrelated upstream
        # HOST provisioning fetch below stays `--depth 1` untouched: that tree needs a working tree
        # and a build, never history.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind to the synthetic merge tree (EB3_MERGE_TREE)
        # Same law as ci-product: the tree this layer grades is the tree the Required
        # summary synthesized, not whatever refs/pull/N/merge happens to be.
        env:
          EB3_EVENT: ${{ github.event_name }}
        run: node scripts/eb3-merge-tree.mjs --assert-tree "${{ inputs.merge_tree }}"

      - name: Precheck — the authority's two git pins are present and HEAD-ancestors
        # Why this step exists (root ruling, 2026-10-22): the census grades claims ABOUT history —
        # state_pointers.master_sha (the round-58 pointer) must be reachable and an ancestor, and
        # the current contract's baseline likewise. The fetch-depth fix above is what makes that
        # true; this step is what makes it FAIL LOUDLY AND BY NAME, before minutes of provisioning
        # and build, if the checkout ever again arrives too shallow for the claim. Local git only:
        # NO network top-up fetch — a precheck that silently deepens the clone would grade a tree
        # Actions never handed the job. Both values are READ, never copied (same rule as the host
        # pin up there), so this step cannot drift from the contract.
        # U2 (G2 switchover) SOURCE LAW for the baseline pin (MC-08):
        #   pointer present  → the baseline comes from the POINTER-RESOLVED SNAPSHOT through the
        #     shared loader (scripts/current-authority.mjs --print-baseline: frozen schema + F0
        #     digest + fail closed, and it goes RED on the two-current state). The old awk over
        #     the graph's current_contract block is GONE — that block was retired at the switch,
        #     and a second regex reader over it would be a second current.
        #   pointer absent   → pre-switch tree, or a tree that reverted the switch commit set:
        #     the legacy awk over graph.yaml keeps the rollback drill green. Exactly one reader
        #     is operative in any given tree; this branch never mixes sources.
        shell: bash
        run: |
          set -euo pipefail
          MASTER_SHA=$(awk '/^state_pointers:/{f=1} f&&/master_sha:/{gsub(/"/,"");print $2; exit}' dev/agent-workflow/graph.yaml)
          if [ -e dev/engineering/current-authority.json ]; then
            if ! PINOUT=$(node scripts/current-authority.mjs --print-baseline --root . 2>&1); then
              echo "::error::AUTHORITY PIN REFUSED: the live pointer failed to resolve a verified baseline — ${PINOUT}"; exit 1
            fi
            BASELINE=$(printf '%s' "$PINOUT" | tr -d '[:space:]')
            if [ -z "$BASELINE" ]; then echo "::error::AUTHORITY PIN REFUSED: the pointer resolver printed an empty baseline"; exit 1; fi
            echo "baseline pin read from the pointer-resolved snapshot"
          else
            BASELINE=$(awk '/^current_contract:/{f=1;next} f&&/^[^[:space:]#]/{f=0} f&&/^[[:space:]]*baseline:/{gsub(/"/,"");print $2; exit}' dev/agent-workflow/graph.yaml)
            echo "baseline pin read from graph.yaml#current_contract (pre-switch/rolled-back tree)"
          fi
          for pair in "state_pointers.master_sha=$MASTER_SHA" "authority.baseline=$BASELINE"; do
            NAME=${pair%%=*}
            OBJ=${pair#*=}
            if [ -z "$OBJ" ]; then
              echo "::error::PIN PRECHECK FAIL: could not read ${NAME} from dev/agent-workflow/graph.yaml — the contract file moved or changed shape"
              exit 1
            fi
            if ! git cat-file -e "${OBJ}^{commit}" 2>/dev/null; then
              echo "::error::PIN PRECHECK FAIL: ${NAME}=${OBJ} is not PRESENT in this checkout — the clone is too shallow for the census ancestor claims (fetch-depth must be 0)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$OBJ" HEAD; then
              echo "::error::PIN PRECHECK FAIL: ${NAME}=${OBJ} exists but is NOT an ancestor of HEAD=$(git rev-parse HEAD) — the census would grade a false unreachability verdict"
              exit 1
            fi
            echo "pin precheck ok: ${NAME}=${OBJ} present and an ancestor of HEAD"
          done

      - name: Setup Node
        # Node 24 and pnpm 11.7.0 are the versions BOTH trees declare: this repo's `packageManager`
        # and the host's `engines: ^22.19 || >=24` + `packageManager pnpm@11.7.0` (TEST_METHODS §2).
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Resolve the pinned pristine host from tests/paths.mjs
        # Read, never copied: see the header. The regex is the fail-closed part — an empty or
        # truncated value here would otherwise become a `git fetch` of nothing, and a fetch that
        # quietly falls back to a branch tip is precisely the drift this job is meant to catch.
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(node -e "import('./tests/paths.mjs').then((m) => console.log(m.TEST_USE_BASELINE_SHA))")
          VER=$(node -e "import('./tests/paths.mjs').then((m) => console.log(m.DSH_BASELINE_VERSION))")
          CH=$(node -e "import('./tests/paths.mjs').then((m) => console.log(m.CLIENT_COMMIT_HASH))")
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tests/paths.mjs gave no 40-hex TEST_USE_BASELINE_SHA (got '${SHA}') — refusing to provision an unpinned host"
            exit 1
          fi
          if [ -z "$VER" ] || [ -z "$CH" ]; then
            echo "::error::tests/paths.mjs gave DSH_BASELINE_VERSION='${VER}' CLIENT_COMMIT_HASH='${CH}'"
            exit 1
          fi
          echo "TEST_USE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "TEST_USE_VERSION=$VER" >> "$GITHUB_ENV"
          echo "TEST_USE_CLIENT_HASH=$CH" >> "$GITHUB_ENV"
          # The values are echoed from the LOCAL names, not the env vars just written: `GITHUB_ENV`
          # publishes to the NEXT step, so reading them back here would print empty lines and a
          # reader would have nothing to check the run against. (Caught by running this step
          # verbatim in a dry run before spending a hosted one — evidence LOCAL-STEP-DRYRUNS.txt.)
          echo "pinned pristine host: $SHA = $VER (client commit $CH)"

      - name: Provision the pinned pristine test host
        # tests/deepseek-harness-test-use is gitignored and self-gits, so a runner checkout does not
        # have it and populating it cannot dirty this repo's status. TEST_METHODS §2/AGENTS.md give
        # the full provenance: baseline 0.2.0-rc.2 @ 639ed01539, detached, porcelain must stay empty.
        shell: bash
        env:
          HOST_URL: https://github.com/ArmourPiercer1/deepseek-harness
          HOST_BRANCH: stable-3-0.2.0-rc.2
          HOST_DIR: tests/deepseek-harness-test-use
        run: |
          set -euo pipefail
          mkdir -p "$HOST_DIR"
          git -C "$HOST_DIR" init -q .
          git -C "$HOST_DIR" remote add origin "$HOST_URL"
          # Fetch the PINNED OBJECT. GitHub answers `fetch <sha>` for anything reachable from a ref,
          # so a moved branch tip cannot substitute for the pin. The fallback below is for a server
          # that refuses SHA fetches: it lands on a tip, and the assertion AFTER it is what makes
          # that substitution a red job naming the drift rather than a green job testing something
          # else. Shallow (--depth 1) because the census needs a working tree and a build, not
          # history; the build's git version lookup is pinned off by DSH_CLIENT_COMMIT_HASH.
          if ! git -C "$HOST_DIR" fetch -q --depth 1 --no-tags origin "$TEST_USE_SHA"; then
            echo "::warning::exact-SHA fetch was refused; falling back to branch tip — the assertion below will fail the job if the tip is not the pin"
            if ! git -C "$HOST_DIR" fetch -q --depth 1 --no-tags origin "$HOST_BRANCH"; then
              echo "::error::could not fetch $HOST_URL ($HOST_BRANCH) — no pristine host, so the census would be ungradeable here"
              exit 1
            fi
          fi
          git -C "$HOST_DIR" checkout -q --detach FETCH_HEAD
          HEAD_SHA=$(git -C "$HOST_DIR" rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TEST_USE_SHA" ]; then
            echo "::error::PRISTINE HOST DRIFT: checked out $HEAD_SHA but tests/paths.mjs pins $TEST_USE_SHA — this job tests a PINNED host, so a different one is a failure, not a variation"
            exit 1
          fi
          DIRTY=$(git -C "$HOST_DIR" status --porcelain | wc -l)
          if [ "$DIRTY" != "0" ]; then
            echo "::error::pristine host checkout is not clean after detach ($DIRTY porcelain line(s)) — the pinned tree must arrive as pinned"
            exit 1
          fi
          HOST_VERSION=$(node -p "require('./${HOST_DIR}/package.json').version")
          if [ "$HOST_VERSION" != "$TEST_USE_VERSION" ]; then
            echo "::error::host at $HEAD_SHA reports version $HOST_VERSION, tests/paths.mjs declares $TEST_USE_VERSION — the pin and the content disagree"
            exit 1
          fi
          echo "provisioned pristine host $HEAD_SHA version=$HOST_VERSION (porcelain clean)"

      - name: Build the pristine host (TEST_METHODS §2 chain)
        # The census legs spawn THIS host, so its build is not a nicety: an unbuilt host turns the
        # runtime-root legs red, and a red census that is really a missing build is the false
        # accusation `pr-gate` was written to avoid. Two §2 facts are load-bearing and both are
        # reproduced verbatim here: `--ignore-scripts` (the chain was measured with it — sandboxed
        # lifecycle spawns are EPERM, and staying on the measured chain beats inventing a second
        # one), and `pnpm run build` rather than `node scripts/build.ts`, because the host's own
        # build orchestrator resolves the package-manager entry via `npm_execpath` and throws
        # "pnpm invocation: npm_execpath is unavailable" when invoked directly.
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
          HOST_DIR: tests/deepseek-harness-test-use
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          cd "$HOST_DIR"
          pnpm install --ignore-scripts --store-dir "$PNPM_STORE_DIR"
          ESBUILD_WORKER_THREADS=1 DSH_CLIENT_COMMIT_HASH="$TEST_USE_CLIENT_HASH" pnpm run build
          cd "$GITHUB_WORKSPACE"
          # The runtime entry the harnesses actually exec. Checked by name because "the build
          # succeeded" and "the build produced the thing the census runs" are different claims, and
          # the census leg cannot tell them apart — it only sees a host that will not boot.
          if [ ! -f "$HOST_DIR/apps/cli/lib/bin.js" ]; then
            echo "::error::host build exited 0 but produced no $HOST_DIR/apps/cli/lib/bin.js — census legs would spawn a host that cannot start"
            exit 1
          fi
          # Re-assert the pin AFTER provisioning, immediately before anything grades anything: the
          # census is about to run against whatever is in this directory, and "it was pinned at
          # fetch time" is a weaker claim than "it is pinned now". Measured that a build does not
          # dirty the pinned tree (porcelain 0 lines after `pnpm run build`), so HEAD is the whole
          # check. `$TEST_USE_SHA` and not a shell variable from an earlier step, because a step's
          # shell dies with the step and only `GITHUB_ENV` crosses the boundary — the first draft of
          # this line echoed `$HEAD_SHA`, which is empty here, and a dry run of the step text
          # printed "present at " with nothing after it (LOCAL-STEP-DRYRUNS.txt).
          BUILT_SHA=$(git -C "$HOST_DIR" rev-parse HEAD)
          if [ "$BUILT_SHA" != "$TEST_USE_SHA" ]; then
            echo "::error::PRISTINE HOST DRIFT AFTER BUILD: $BUILT_SHA, tests/paths.mjs pins $TEST_USE_SHA — the census would grade the wrong host"
            exit 1
          fi
          echo "host build ok: $HOST_DIR/apps/cli/lib/bin.js present at $BUILT_SHA"

      # NEXT HOST LANE (Task B, 2026-11-19) — THE SECOND PINNED HOST, COLLECTED.
      #
      # WHY HERE. `tests/deepseek-harness-next/` is a gitignored checkout at upstream
      # tag `dsh-v0.2.2-rc.5` and its native `bin/` payload is not in the host's git
      # either, so a runner NEVER has it. Before this change the two suites that
      # prove the rc.5 lane (`tests/next-host/boot.test.mjs`, `native-api.test.mjs`)
      # were listed in `dev/ci/excluded-baseline.json` — the non-execution channel —
      # so "discovered but never executed" was the only state they could be in on a
      # hosted run, and the exclusion reason said so. This job is the one that
      # WAS ALREADY ALLOWED TO PROVISION A HOST (and already treats a missing one as
      # a failure), so it is the only honest home for the second one.
      #
      # THREE STEPS, ONE PER FAILURE BOUNDARY, so a red names which boundary broke:
      #   1. materialize: tag -> commit -> version -> build, with named refusals
      #      (`TAG_DRIFT`, `HEAD_DRIFT`, `VERSION_DRIFT`, `INSTALL_FAILED`,
      #      `BUILD_FAILED`, `TREE_DIRTY`). Network: upstream git + the tree's own
      #      pinned pnpm (its `packageManager` is 11.28.5, NOT this repo's 11.7.0).
      #   2. assets: the pinned PUBLISHED package (exact version, registry
      #      dist.integrity + committed sha256 + per-file sha256/length/mode), never
      #      a local build — a hosted `pnpm run build` produces a DIFFERENT
      #      `bin/glibc/system.node` (measured 75450f92…/17352 B vs pin
      #      54a9c25c…/17360 B), so the published artifact is the standard.
      #   3. the lane: real boot + the native API arms A1–A6 + the provisioning
      #      negative controls (the refusals above, fired against fixtures).
      # NO SKIP PATH IS DECLARED. There is no `if:`, no `continue-on-error`, no
      # allow-flag: an absent tree, a drifted HEAD, a wrong version or non-pinned
      # bytes FAIL this job (the suites throw at module load; the CLI exits 1), which
      # is exactly the difference between collecting a lane and pretending to.
      # COST: one clone + one install + one build (a second host build: 130 s locally,
      # 2–4x hosted) + one boot (2.0 s locally). The job timeout below carries the
      # headroom; the census argv, its two captures and its population are untouched
      # by these steps, which run BEFORE the census precisely so a provisioning red
      # does not cost the census first.
      # ARGV DISCIPLINE: each `run:` line is EXACTLY one manifest leg of `ci-census`
      # in dev/ci/eb3-ci-manifest.json (`next host materialize`, `next host assets`,
      # `next host lane`); the whole trailing argv law applies to all three.
      - name: Next host — materialize the pinned rc.5 tree (tag → commit → version → build)
        shell: bash
        timeout-minutes: 30
        run: node scripts/provision-next-host.mjs --materialize

      - name: Next host — native sandbox assets from the pinned published package (exact version, digest-verified)
        shell: bash
        timeout-minutes: 10
        run: node scripts/provision-next-host.mjs --assets

      - name: Next host — the rc.5 lane (real boot, native API A1–A6, provisioning negative controls)
        shell: bash
        timeout-minutes: 15
        run: node --test --test-force-exit --test-timeout=1500000 --test-reporter=spec tests/next-host/boot.test.mjs tests/next-host/native-api.test.mjs tests/next-host/provisioning-controls.test.mjs tests/world-factory/f10-contract-identity.test.mjs scripts/ute-retirement-gate.test.mjs tests/ute2-settlement/settlement.test.mjs tests/ute2-settlement/dispatch-settlement.test.mjs scripts/ute-family-inventory.test.mjs scripts/check-append-only-log.test.mjs

      - name: Build this repo (packages + composition) — the census leg REFUSES without this
        # Verbatim `pr-gate`'s working step. A fresh checkout has the committed package artifacts
        # but no composition build, and the composition-smoke arm inside the census answers
        # `refused` ("this checkout was never built"), which the census then reports as a NEW RED
        # identity. `--frozen-lockfile` keeps the install an assertion about the lockfile, not a
        # write to it.
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
          pnpm run build
          pnpm build:composition

      - name: "UTE G1 — FS binding: product module + real assembly (pinned rc.5 host)"
        # WHY THIS STEP SITS AFTER THE BUILD. The suite's host-free arms need only the pinned
        # rc.5 tree, but its three assembly tests mount the product route-C row, which imports
        # this repo's own packages (`@deepseek-ai/dsh-scope`, the runtime row, the team services).
        # A fresh job has no repo `node_modules` until `pnpm install` runs, and the `Next host —
        # the rc.5 lane` step above deliberately runs BEFORE this build. Hosted run
        # `2ec811f6f` measured the consequence at 7m45s: the assembly arms died with
        # `ERR_MODULE_NOT_FOUND: Cannot find package '@deepseek-ai/dsh-scope' imported from
        # packages/runtime/src/plugin/live/a5sf-realm-row.mjs`, while the host-free arms passed.
        # The suite therefore runs here, after `pnpm install && pnpm run build`, with its OWN
        # --test-timeout value: the manifest leg is then attributable to exactly this step (the
        # whole-trailing-argv reader keys a leg on its cmd, so two legs sharing `--test-timeout`
        # could each read the other's line). UTE-3's `tests/ute-g1-fs/lane-suite.test.mjs` rides
        # the SAME argv for the same measured reason: its per-member controls mount the realm row,
        # so hosted run 44759369386 red it pre-build with the identical ERR_MODULE_NOT_FOUND.
        # The UTE-3 route-C repair's product-route suite rides it too: it dispatches the FOURTH FS
        # member through the real route-C row, which imports the same repo packages post-build
        # (pre-repair that member was refused before any image work).
        # UTE-3 (2026-11-20): `tests/ute-g1-fs/lib/refusal-categories.test.mjs` (the FS refusal
        # vocabulary + its six mutation controls) rides this same argv. Its corpus arms need
        # nothing from this build; since the route-C repair its `route-unresolved` reachability
        # arm DRIVES the withheld-continuation fixture (FSB-IMG-1b), so it is host-requiring
        # like its siblings and rides post-build for family co-location (no new dispatch leg).
        # UTE-3 B1 SEARCH (2026-11-20): `tests/ute-g1-search/lane-suite.test.mjs` rides the same
        # argv for the same post-build reason (its C1 world imports this repo's packages through
        # a5sf-realm-row.mjs). It grades the 15-vector SEARCH old-path golden, both members'
        # coverage, the closed refusal vocabulary, the pinned PENDING new path, and the family +
        # per-member negative controls (`NC-VERDICT GREEN controls=8 failed=0`).
        # UTE-3 stage B1 WEB (2026-11-20): `tests/ute-g1-web/lane-suite.test.mjs` rides the same
        # argv for the same post-build reason (its C1 world imports this repo's packages through
        # a5sf-realm-row.mjs, and its controls bind a real loopback fixture behind the confined web
        # face). It grades the 15-vector WEB old-path golden, both members' coverage, the closed
        # refusal vocabulary, the measured socket witness (zero non-loopback connects), and the
        # family + per-member negative controls (`NC-VERDICT GREEN controls=11 failed=0`).
        shell: bash
        timeout-minutes: 10
        run: node --test --test-force-exit --test-timeout=480000 --test-reporter=spec tests/ute1-fs/native-fs-binding.test.mjs tests/ute-g1-fs/lane-suite.test.mjs tests/ute-g1-fs/lib/refusal-categories.test.mjs tests/ute-g1-fs/product-route-image.test.mjs tests/ute-g1-search/lane-suite.test.mjs tests/ute-g1-web/lane-suite.test.mjs tests/ute-g1-agentctl/lane-suite.test.mjs

      # `--full --only census`, chosen over a full 7-leg re-run, and the reason is that the other
      # six legs grade the checkout and the build, not the host: `graph-parse`, `install`,
      # `blueprint-fence`, `typecheck`, `lint-identities`, `artifacts-at-head` run on the identical
      # commit against the identical tree inside `pr-gate`, minutes earlier, for free. Re-running
      # them here would double an already expensive job to re-derive a verdict another job already
      # states, and would blur the one thing this check's name promises. `--full` is still there
      # because it changes what an abstention MEANS inside the selected set (under `--full` a skip
      # is a failure), and `--only census` keeps the job's meaning singular.
      #
      # NO `--allow-refused`. That absence is the whole deliverable: with the exemption withheld, a
      # missing or unusable host comes back `verdict=fail` —
      # `(undeclared refusal — … declare it: --allow-refused census)` — so this check cannot be
      # green on a run that did not measure the population. `pr-gate`'s declared exemption and its
      # `refusedlegs=census` token are untouched; that job still means "static + build legs passed,
      # census not measured here", and THIS check is where the census actually ran.
      #
      # `--census-captures 2` carries over for the reason recorded in `pr-gate.yml` (two captures
      # graded as their union). The CLOCK deliberately does NOT carry over, and the value chosen is
      # declared and reasoned on the step below — including an admission that it is not yet measured
      # on hosted hardware. The clock in force is printed on every leg line either way.
      # THE CLOCK. `--census-test-timeout` is an operator override above vitest's 5000 ms default and
      # the value in force is printed on every leg line, because a clock below a leg's own budget does
      # not measure that leg, it forfeits it. Two legs in the corpus state budgets above the 20000 used
      # elsewhere: the client-lane leg of `a4p7-merge-gate` takes ~23 s on a 32-core box (it spawns
      # nested builds), and `rc2-sanitize-evidence` S13 declares `timeout: 60_000` for a nested
      # `node --test`. 90000 is sized to dominate those. SAYING WHAT THIS IS NOT: it is NOT a hosted
      # measurement — no green hosted run of this job has happened yet — and an earlier revision of
      # this comment claimed the first run forfeited S13 at 20000 and that raising the clock cleared
      # it. That was FALSE. Read off the uploaded transcripts, S13 passed in all four captures
      # (1938/1967/2827/2459 ms) and BOTH runs failed the SAME identity, the client-lane leg, because
      # its parser could not read a coloured vitest summary (0 lines match `^\s*(Test Files|Tests)\s`
      # as written, 2 after stripping ANSI). See the dated correction on PR #219. Replace this value
      # with the first green run's per-step numbers, or drop it back to 20000 if that run shows
      # nothing needs more.
      - name: Host-provisioned security suites (moved from ci-security; needs the pinned host)
        run: node scripts/eb3-security-run.mjs --layer ci-census --list-file tests/checks/eb3-host-security-suites.txt --timeout 20000

      - name: Census — nine roots, two captures, NO refusal permitted
        shell: bash
        env:
          # The `runner` context is legal HERE (it is not in `jobs.<id>.env`; see the note up there).
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          DSH_CI_STORE_DIR: ${{ runner.temp }}/pnpm-store
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          node scripts/ci-pr-gate.mjs --full \
            --only census \
            --census-execution plan \
            --census-captures 2 \
            --census-test-timeout 90000 \
            --store-dir "$DSH_CI_STORE_DIR" \
            --transcript-dir "$RUNNER_TEMP/census-transcripts" \
            2>&1 | tee "$RUNNER_TEMP/census-run.txt"

      # Second reader, same rule as `pr-gate`: the job's exit code is not the authority, the
      # transcript is. No DSH-CI-VERDICT line means FAIL, a run that stopped mid-leg means FAIL, and
      # a leg that refused without a declaration — the shape of "the host vanished and nobody
      # noticed" — means FAIL here in both directions, because this job declares nothing.
      - name: Census — re-grade the transcript by the missing-token rule
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          node scripts/ci-pr-gate.mjs --check-transcript "$RUNNER_TEMP/census-run.txt"

      # M7-A (2026-11-15): the C2 half of the real-host slice — the Contract Oracle in front of a
      # REAL execution chain (scripted model on the provider wire -> dsh web -> real Agent Session
      # -> real tool resolution -> real execution -> independent FS observation -> judgeContract).
      # WHY IT LIVES HERE. This is the only job that provisions and builds the pinned pristine host,
      # and the only one where a missing host is already a failure; the slice's five arms are
      # worthless as a gate if the ordinary outcome is "host absent, declared refusal, skipped".
      # M7A_REQUIRE_PINNED_HOST=1 is therefore not a convenience: with it the suite turns an absent
      # host into a hard, named failure, which is the difference between collecting the suite and
      # pretending to. M7A_BOOT_TIMEOUT_MS=600000 because this runner's first boot of the pinned
      # host is slower than the 130 s measured locally (the census job's own note records a 2-4x
      # hosted factor); a boot timeout below a real boot forfeits the suite rather than grading it.
      # COST, stated so the 60-minute job timeout can be checked against it: one boot + five arms =
      # 133 s measured locally (boot 130 s, teardown 0.1 s); at the same conservative 4x factor the
      # delta is ~9 min on top of the census job's ~8-10 min floor, well inside 60.
      # IT DOES NOT TOUCH THE CENSUS. This is a separate step after the census and its transcript
      # re-grade: the census argv, its two captures, its population and the plan are unchanged; a
      # failure here fails the job (and its layer verdict) without changing what the census graded.
      # THREE DEFENCES, BECAUSE THE FIRST HOSTED RUN PROVED ONE IS NOT ENOUGH (2026-11-15,
      # job 132898455498): the suite failed 166 ms in, the process then held an open handle for
      # 41 MINUTES, and the 60-minute job timeout cancelled the whole L2. The step never
      # printed the failure's text, because the spec reporter flushes failures at the END.
      #   (1) the suite releases what it started on the throw itself, in `t.after`, and in its
      #       `finally` (`scripts`-free: tests/world-factory/m7a-real-run.mjs startRealRun closes
      #       the in-process mock provider on every failure path; U11 pins it);
      #   (2) `--test-force-exit` closes the last escape hatch: a handle nobody tracks cannot
      #       outlive the run, so the step exits with the verdict it actually reached;
      #   (3) `timeout-minutes: 10` bounds the step even if both of the above regress — a red
      #       inside ten minutes beats a cancelled job, which reports NOTHING about the code.
      # The failure is also printed to stderr immediately (`[M7A] PRECONDITION <name> FAILED: …`
      # and `[M7A] SUITE FAILED: …`), so a bounded red names its cause on the first line.
      # NO EXEMPTION ANY MORE (2026-11-16). Until this commit the step accepted exactly one
      # non-verification — the sandbox-asset digest refusal, named `M7A-HOST-ASSET-UNPROVISIONABLE`,
      # zero arms graded — because it was set with `M7A_ALLOW_UNPROVISIONABLE_HOST=1` HERE and
      # nowhere else. That is GONE: the step above provisions the pinned bytes from the PINNED
      # PUBLISHED package, so the "this runner cannot carry the pinned bytes" fact no longer holds.
      # The refusal code path still exists in `tests/world-factory/lib/m7a-step-verdict.mjs`, still
      # defaults OFF, and is still tested — but no workflow sets it, so it is unreachable from CI
      # (`tests/world-factory/host-sandbox-assets.test.mjs` T38 greps every workflow for it). A
      # refusal here now fails the job; the slice must produce `M7A-STEP verdict=VERIFIED arms=5`.
      # The assets are installed by the step immediately above (tarball only, exact version, verified
      # against the UNCHANGED sha256 pin); this step's own contract is unchanged otherwise.
      # HOST SANDBOX ASSETS (2026-11-16) — the PINNED PUBLISHED PACKAGE, not the runner's build.
      # MEASURED (2026-11-16, owner download; recorded in the manifest's `packages` block and in
      # docs/plans/memo/host-assets-20261116/README.md): the published tarball
      # `@deepseek-ai/node-addon-system-linux-x64@0.1.2` (25758 bytes, sha256 77fb771b…, registry
      # dist.integrity sha512-S2aPVHvY…) carries EXACTLY the bytes the committed manifest already
      # pins — `bin/glibc/system.node` sha256 54a9c25c… (17360 B) and `bin/landlock-run` sha256
      # a752bc72… (38552 B). A hosted runner's own host build produces DIFFERENT bytes for the addon
      # (measured dfa6d586… in job 132898455498, the exact `DESTINATION_DIGEST_MISMATCH` the M7-A
      # step used to disclose).
      # THE DECISION (owner, 2026-11-16): the FIXED PUBLISHED ASSET is the standard; the runner's
      # build is not. Keep the existing sha256 pin, do NOT move it to match a build, and provision
      # from the pinned published version only (exact version — no ranges, no `latest`). The tarball
      # is verified against the registry's published dist.integrity AND the pinned tarball sha256,
      # every file against the pin, and only then installed. Tarball only: no pnpm install of the
      # package, no repo dependency, no upstream patch (CORE PATCH BUDGET = 0).
      # WHOLE-ARGV DISCIPLINE: this line is EXACTLY the `ci-census` leg
      # `host-sandbox assets (pinned published package)` in dev/ci/eb3-ci-manifest.json, and
      # `eb3-ci-required` grades it the same way it grades the M7-A step.
      # ORDER: after the census and its re-grade (the census population and its captures are
      # untouched), immediately before M7-A, which reads these assets.
      - name: Host sandbox assets — provision the PINNED published package (exact version, verified)
        shell: bash
        run: node scripts/provision-host-assets.mjs --from-package @deepseek-ai/node-addon-system-linux-x64@0.1.2

      - name: M7-A real-host slice — one real boot, five arms (pinned host REQUIRED, never skipped)
        shell: bash
        timeout-minutes: 10
        env:
          M7A_REQUIRE_PINNED_HOST: '1'
          M7A_BOOT_TIMEOUT_MS: '600000'
          # Recorded verbatim in m7a-step.json: a node:test child cannot see the flags the runner
          # consumed (`--test-reporter=spec`), so the step declares its own command instead.
          M7A_STEP_ARGV: 'node --test --test-force-exit --test-timeout=900000 --test-reporter=spec tests/world-factory/m7a-real-slice.test.mjs'
          # The record is bound to THIS run; a record left by an earlier job (or seeded by hand)
          # is STALE at the ledger, not this run's verdict.
          M7A_STEP_RUN_ID: '${{ github.run_id }}-${{ github.run_attempt }}'
        run: node --test --test-force-exit --test-timeout=900000 --test-reporter=spec tests/world-factory/m7a-real-slice.test.mjs

      # One line per L2, always: whether the real-host capability was VERIFIED (five arms graded)
      # or DISCLOSED-REFUSED BY NAME on this runner. Strict reader: a missing `m7a-step.json` is a
      # failure, a VERIFIED record needs graded arms, and the refusal needs the one accepted reason.
      # Prints `M7A-STEP-LEDGER verdict=… reason=… …` on stdout.
      - name: M7-A step ledger — VERIFIED or DISCLOSED-REFUSAL, in one greppable line
        shell: bash
        if: always()
        env:
          # Same identity + declared argv as the suite step: the ledger re-checks both.
          M7A_STEP_RUN_ID: '${{ github.run_id }}-${{ github.run_attempt }}'
          M7A_STEP_ARGV: 'node --test --test-force-exit --test-timeout=900000 --test-reporter=spec tests/world-factory/m7a-real-slice.test.mjs'
        run: node scripts/m7a-step-ledger.mjs

      # B4 BATCH 1/2 (2026-11-16) — the SUBPROCESS security boundary, collected.
      # WHY HERE. These two suites resolve the pinned pristine host at module load
      # (`findTestRepoRoot()` -> tests/paths.mjs) and were UNCOLLECTED: no lane ran
      # them, so the PTY and subprocess contract laws were only ever demonstrated by
      # hand. `ci-integration` cannot take them (it provisions no host, and a suite
      # there would be a `hostFree` lie); this job provisions and builds the host and
      # already treats a missing one as a failure. Measured 2026-11-16 with the host
      # present: pty-contract 15/15 in 0.43 s, sub-contract 15/15 in 26.3 s.
      # MISSING HOST = RED, proved twice (evidence
      # dev/agent-workflow/evidence/b4-host-dependent-20261116/): with the host tree
      # bind-mounted EMPTY both suites exit 1 with a NAMED refusal
      # (`A5SF-PTY-CONTRACT-HOST-INCOMPLETE` / `A5SF-SUB-CONTRACT-HOST-INCOMPLETE`),
      # and `A5SF_REQUIRE_PINNED_HOST=1` is what turns the declared NOT_RUN into that
      # failure, so the flag is declared on the manifest leg AND set here.
      # NO SKIP PATH: neither suite may report NOT_RUN-with-skips as a pass here.
      - name: B4/1 subprocess boundary — PTY + subprocess contract (pinned host, absence is RED)
        shell: bash
        timeout-minutes: 15
        env:
          A5SF_REQUIRE_PINNED_HOST: '1'
        run: node --test --test-force-exit --test-timeout=600000 --test-reporter=spec tests/world-factory/a5sf-pty-contract.test.mjs tests/world-factory/a5sf-sub-contract.test.mjs

      # B4 BATCH 2/2 — the WEB face (confined fetch/search, row wiring) plus the
      # `read_image` attachment face. Same rule, same reason: all three resolve the
      # pinned host (web modules at module load, the read_image driver through the
      # World graph). Measured with the host present: web-contract 10/10 in 0.42 s,
      # web-row 10/10 in 0.44 s, pd31-read-image 7/7 in 0.12 s. Measured with the host
      # tree EMPTY: web-contract 0/1 (`A5SF-WEB-CONTRACT-HOST-REFUSED`), web-row 0/1
      # (`ERR_MODULE_NOT_FOUND` on the pinned `packages/web/web/lib/index.js`),
      # pd31-read-image 4 pass / 3 fail. A separate step (not one argv with batch 1)
      # so a red names WHICH boundary broke.
      - name: B4/2 web + read_image face — confined web contract and the attachment face (pinned host, absence is RED)
        shell: bash
        timeout-minutes: 10
        env:
          A5SF_REQUIRE_PINNED_HOST: '1'
        run: node --test --test-force-exit --test-timeout=300000 --test-reporter=spec tests/world-factory/a5sf-web-contract.test.mjs tests/world-factory/a5sf-web-row.test.mjs tests/world-factory/a5sf-pd31-read-image.test.mjs

      # M7-B1 (2026-11-16): the World Factory OWNS the filesystem observation window
      # (identity + declared scope + pre/post window + witness provenance) and three
      # real FS controls prove the window bites: an authorized write is reported and
      # excluded, a write outside the authorized set is VIOLATED naming the exact
      # path, and a write in the SAME directory the harness itself writes to is caught
      # per-entry (a directory-shaped watch would miss it). The verbatim
      # `FS_SANDBOX_DENIED` line the Host emits is captured from its durable trace.
      # WHY HERE: same reason as M7-A - this is the only job that provisions the
      # pinned host and whose absence of one is already a failure.
      # `M7B1_REQUIRE_PINNED_HOST=1` turns the declared refusal into a hard failure, so
      # a green run cannot mean "the host was missing and nothing ran". Without it the
      # suite still grades the fail-closed half and answers
      # INSTRUMENT_ERROR reason=HOST_ABSENT.
      # COST: one boot + three real arms, measured locally (host-present; the wall time
      # is in dev/agent-workflow/evidence/m7b1-observation-window-20261116/) and
      # bounded by `timeout-minutes: 15` so a regression is a bounded red rather than a
      # cancelled job (the M7-A 41-minute hang is why every new step carries one).
      - name: M7-B1 observation window — World-Factory-owned scope + three FS negative controls (pinned host, absence is RED)
        shell: bash
        timeout-minutes: 15
        env:
          M7B1_REQUIRE_PINNED_HOST: '1'
          M7B1_BOOT_TIMEOUT_MS: '600000'
        run: node --test --test-force-exit --test-timeout=1200000 --test-reporter=spec tests/world-factory/m7b1-observation-window.test.mjs

      # What to read when this job is red: `census-run.txt` first (the gate's own
      # channel: the DSH-CI tokens, the graded identity sets, and — since the
      # 2026-10-18 forensics round — a BOUNDED key-line echo per failed command:
      # only `FORENSIC|MEASURED` hit lines are echoed (a leg's own failure scene:
      # `a5lsp2 FORENSIC` blocks, `a5glb L3 MEASURED` lines), line-marked with
      # `| `, hard-capped at 200 lines (head+tail split) x 300 chars/line x
      # 24,000 bytes total; when lines are dropped an `echo capped` note says so.
      # The echo ends with a `full capture:` pointer naming the per-command file
      # under `census-transcripts/` — those stay the complete, uncut copies (the
      # caps live in scripts/ci-pr-gate.mjs: ECHO_LINE_LIMIT/ECHO_LINE_CAP/
      # ECHO_BYTE_CAP, pinned by that file's own bound-by-construction legs).
      # TINF M3 (2026-11-14): `census-transcripts/tinf-timing.tsv` — the harness-level timing rows
      # that decompose the ONE census step the Actions API reports (`scripts/tinf-timing.mjs`; the
      # step-level split above the census stays with `scripts/census-profile.mjs`). Shadow: the file
      # is written by the census leg only when `--transcript-dir` is set, nothing grades it, and a
      # timer that cannot write degrades to a named warning line instead of a red census. Listed
      # explicitly (it is also inside the directory above) so a reader can see that this milestone
      # ships a measurement file, not just a transcript. NO new Required context, NO concurrency
      # change, NO change to what `ci-required` grades.
      - name: Upload census transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-runtime-transcripts-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/census-run.txt
            ${{ runner.temp }}/census-transcripts/
            ${{ runner.temp }}/census-transcripts/tinf-timing.tsv
            ${{ github.workspace }}/.artifacts/tmp/m7a-real-slice/m7a-step.json
          if-no-files-found: warn

      - name: Layer verdict token (feeds the Required summary; runs even when a step above failed)
        id: eb3_layer_verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${{ job.status }}" in
            success) V=PASS ;;
            cancelled) V=CANCELLED ;;
            *) V=FAIL ;;
          esac
          echo "EB3-LAYER layer=ci-census verdict=$V status=${{ job.status }}"
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
